<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Hibbeler Statics Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single-column logbook. Sticky week bar, tabbed week pages, and stencil-style labels borrowed from hull and deck markings. */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#14232e; --muted:#5a6a75; --line:#d5dde2;
  --navy:#173a52; --signal:#d9531e; --signal-soft:#fbe6dc; --ok:#1f7a4d; --ok-soft:#dcf1e5; --bad:#b3261e; --bad-soft:#f8e0de;
  --chip:#e3e9ed; --code:#f3f6f8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e171d; --panel:#16232c; --ink:#e4ecf1; --muted:#9aacb8; --line:#2a3b47;
  --navy:#8fc1e3; --signal:#f07a45; --signal-soft:#3a2219; --ok:#5cc58f; --ok-soft:#16301f; --bad:#f08a80; --bad-soft:#3a1c1a;
  --chip:#22323d; --code:#1b2a34; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e171d; --panel:#16232c; --ink:#e4ecf1; --muted:#9aacb8; --line:#2a3b47;
  --navy:#8fc1e3; --signal:#f07a45; --signal-soft:#3a2219; --ok:#5cc58f; --ok-soft:#16301f; --bad:#f08a80; --bad-soft:#3a1c1a;
  --chip:#22323d; --code:#1b2a34; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
a{color:var(--navy)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.15;text-wrap:balance;margin:0}
.label{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted)}
sub,sup{font-size:.72em;line-height:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand b{color:var(--signal)}
.weeks{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:none;width:30px;height:30px;border-radius:4px;border:1px solid var(--line);background:var(--panel);font:600 14px var(--display);cursor:pointer;display:grid;place-items:center;color:var(--ink);text-decoration:none}
.wk.done{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.wk.cur{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.toplink{font:600 14px var(--display);text-transform:uppercase;letter-spacing:.06em;text-decoration:none;color:var(--muted);white-space:nowrap}

/* home */
.hero{padding-block:28px 8px;display:grid;gap:10px}
.hero h1{font-size:clamp(34px,7vw,52px);text-transform:uppercase}
.hero p{margin:0;max-width:62ch;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.stat .v{font:700 30px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat .v small{font-size:16px;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--signal)}
.startrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-block:4px 18px;font-size:14px;color:var(--muted)}
.startrow input{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--navy)}
.card .num{font:700 34px/1 var(--display);color:var(--navy);grid-row:span 3;min-width:38px;font-variant-numeric:tabular-nums}
.card .t{font-weight:600;line-height:1.3}
.card .c{font-size:13px;color:var(--muted)}
.card.now{border-color:var(--signal);box-shadow:inset 3px 0 0 var(--signal)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font:600 12px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:3px;background:var(--chip);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.go{background:var(--signal-soft);color:var(--signal)}
.chip.core{background:var(--navy);color:var(--panel)}
.section{margin-block:30px 0;display:grid;gap:12px}
.section h2{font-size:26px;text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.panel p{margin:0 0 .6em}
.panel p:last-child{margin-bottom:0}
.sessions{display:grid;gap:8px;counter-reset:s}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .time{font:600 14px var(--mono);color:var(--muted);white-space:nowrap}
.srow .k{font-weight:600}
.srow .d{font-size:14px;color:var(--muted)}

/* week page */
.whead{padding-block:22px 6px;display:grid;gap:6px}
.whead h1{font-size:clamp(28px,5.5vw,40px)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-block:14px 18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;padding:8px 12px;font:600 16px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.stack{display:grid;gap:14px}
ul.obj{margin:0;padding-left:20px}
ul.obj li{margin-block:3px}
table{border-collapse:collapse;width:100%;font-size:14px}
.tablewrap{overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.mono,.mono{font-family:var(--mono);font-size:13px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--ok);flex:none}
.note h3{font-size:20px;margin-bottom:4px}
.formula td:last-child{font-family:var(--mono);font-size:13.5px;white-space:nowrap}
.marine{border-left:4px solid var(--signal);background:var(--signal-soft);border-radius:0 6px 6px 0;padding:12px 16px}
.marine .label{color:var(--signal)}
.marine p{margin:4px 0 0}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:8px;background:var(--code);border-radius:4px;padding:8px 10px}
.steps li::before{content:counter(st);font:700 18px/1.3 var(--display);color:var(--navy)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--navy);background:var(--navy);color:var(--panel);border-radius:4px;padding:8px 14px;font:600 15px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:transparent;color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.answer{border:1px solid var(--ok);background:var(--ok-soft);border-radius:4px;padding:10px 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* test */
.q{display:grid;gap:10px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.q.right{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.q.wrong{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.qn{font:700 15px var(--display);letter-spacing:.06em;color:var(--signal)}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:8px 10px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--navy);flex:none}
.opt.is-right{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-picked-wrong{border-color:var(--bad);background:var(--bad-soft)}
.numin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numin input{width:150px;max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-family:var(--mono)}
.numin .u{font-family:var(--mono);color:var(--muted)}
.fb{font-size:14px;border-top:1px dashed var(--line);padding-top:10px}
.fb b.r{color:var(--ok)} .fb b.w{color:var(--bad)}
.score{scroll-margin-top:70px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;padding:16px 18px;border-radius:6px;background:var(--panel);border:2px solid var(--navy)}
.score .big{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums}
.score.pass{border-color:var(--ok)} .score.pass .big{color:var(--ok)}
.score.fail{border-color:var(--signal)} .score.fail .big{color:var(--signal)}
.hint{font-size:13px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
@media (max-width:520px){.brand span{display:none}.srow{grid-template-columns:auto 1fr}.srow .time{grid-column:2}}
@media (prefers-reduced-motion:no-preference){.q,.card{transition:border-color .15s}}
</style>

<script type="application/json" id="course-data">{"weeks":[{"n":1,"title":"Units, vectors and adding forces","chapter":"Ch. 1 & 2.1–2.4","readings":[{"sec":"1.1–1.6","title":"General principles, units, numerical work","pages":"book pp. 3–16 (PDF pp. 25–38)","depth":"core"},{"sec":"2.1–2.3","title":"Scalars, vectors, parallelogram law","pages":"book pp. 17–32 (PDF pp. 39–54)","depth":"core"},{"sec":"2.4","title":"Adding a system of coplanar forces","pages":"book pp. 33–43 (PDF pp. 55–65)","depth":"core"}],"objectives":["Work in SI units and prefixes, and convert mass to weight with W = mg","Add two forces with the parallelogram law, using the cosine and sine rules","Resolve any force into x and y components, including 3-4-5 slopes","Find the resultant and the equilibrant of a set of coplanar forces"],"notes":[{"h":"What statics is","p":"Statics is the study of bodies that are at rest or moving at constant velocity, so the acceleration is zero. Every problem in this book comes down to one idea: <b>the forces on a body balance<\/b>. This week you learn to add forces correctly. Everything after this builds on that."},{"h":"Newton's laws and weight","p":"1st law: with no unbalanced force, a body stays at rest or keeps moving in a straight line. 2nd law: F = ma. 3rd law: action and reaction are equal and opposite. Weight is the force gravity puts on a mass: <b>W = mg<\/b>, with g = 9.81 m/s². A 1 kg mass weighs 9.81 N. A 1 tonne (1 Mg) mass weighs 9.81 kN."},{"h":"SI units and prefixes","p":"The newton is a derived unit: 1 N = 1 kg·m/s². Prefixes go in steps of 1000: kilo (k, 10³), mega (M, 10⁶), giga (G, 10⁹), milli (m, 10⁻³), micro (μ, 10⁻⁶). Write 1 tonne as 1 Mg, never 1 kkg. Carry at least 4 figures through a calculation and round the final answer to 3 significant figures, as the book does."},{"h":"Vectors","p":"A <b>scalar<\/b> has size only (mass, time, length). A <b>vector<\/b> has size and direction (force, velocity, moment). You add two vectors with the <b>parallelogram law<\/b>: put them tail to tail, complete the parallelogram, and the diagonal is the resultant. The half-version is the <b>triangle rule<\/b>, which puts them head to tail. Solve the triangle with the cosine rule for the magnitude and the sine rule for the angle."},{"h":"Resolving into components","p":"For a force F at angle θ measured from the +x axis: F<sub>x<\/sub> = F cos θ and F<sub>y<\/sub> = F sin θ. When the direction is given as a slope triangle, for example rise 3 and run 4 with hypotenuse 5, use the ratios: F<sub>x<\/sub> = F(4/5) and F<sub>y<\/sub> = F(3/5). Always check the sign of each component from a sketch. Don't trust the calculator to get the quadrant right."},{"h":"Resultant of many forces","p":"Add all the x-components and all the y-components: F<sub>Rx<\/sub> = ΣF<sub>x<\/sub> and F<sub>Ry<\/sub> = ΣF<sub>y<\/sub>. Then F<sub>R<\/sub> = √(F<sub>Rx<\/sub>² + F<sub>Ry<\/sub>²), and the direction is θ = tan⁻¹(|F<sub>Ry<\/sub>|/|F<sub>Rx<\/sub>|), placed in the right quadrant by looking at the signs."},{"h":"Equilibrant (exam term)","p":"Hibbeler rarely uses the word, but Transport Canada exam papers do. The <b>equilibrant<\/b> is the single force that would hold the system in balance. It has the same magnitude as the resultant, acts along the same line, and points the opposite way, so its direction is θ<sub>R<\/sub> + 180°."}],"formulas":[["Weight","W = m g,  g = 9.81 m/s²"],["Cosine rule","C = √(A² + B² − 2AB cos c)"],["Parallelogram (angle θ between the forces)","R = √(A² + B² + 2AB cos θ)"],["Sine rule","A / sin a = B / sin b = C / sin c"],["Components","F<sub>x<\/sub> = F cos θ,  F<sub>y<\/sub> = F sin θ"],["Resultant","F<sub>R<\/sub> = √((ΣF<sub>x<\/sub>)² + (ΣF<sub>y<\/sub>)²),  θ = tan⁻¹(ΣF<sub>y<\/sub> / ΣF<sub>x<\/sub>)"],["Equilibrant","E = F<sub>R<\/sub>, direction θ<sub>R<\/sub> + 180°"]],"example":{"title":"Three lines on one bollard","problem":"Three mooring lines pull on one deck bollard. Take +x as forward and measure angles anticlockwise from +x: 5 kN at 0°, 8 kN at 60° and 4 kN at 150°. Find the resultant force on the bollard and the equilibrant that the bollard's foundation has to provide.","steps":["x-components: 5 cos 0° + 8 cos 60° + 4 cos 150° = 5 + 4 − 3.464 = <b>5.536 kN<\/b>","y-components: 5 sin 0° + 8 sin 60° + 4 sin 150° = 0 + 6.928 + 2 = <b>8.928 kN<\/b>","Magnitude: F<sub>R<\/sub> = √(5.536² + 8.928²) = <b>10.5 kN<\/b>","Direction: both components are positive, so the resultant is in the 1st quadrant. θ = tan⁻¹(8.928/5.536) = <b>58.2°<\/b>","Equilibrant: 10.5 kN acting at 58.2° + 180° = <b>238°<\/b>"],"answer":"F<sub>R<\/sub> = 10.5 kN at 58.2°. Equilibrant = 10.5 kN at 238°."},"marine":"Two tugs on one tow, several mooring lines on a bollard, and a chain block hanging from a padeye that is pulled sideways are all coplanar force additions. The Applied Mechanics exams ask for the resultant and equilibrant of concurrent coplanar forces by name, so get fast and tidy at the component method this week.","practice":[{"set":"Preliminary","items":"P2–1, P2–2","where":"book p. 27; solutions p. 638"},{"set":"Fundamental","items":"F2–1 to F2–12","where":"book pp. 28 & 39; solutions p. 620"},{"set":"Review","items":"R2–1 to R2–4","where":"book p. 84; solutions p. 648"}],"test":[{"type":"mc","q":"Which of these quantities is a vector?","options":["Mass","Time","Force","Volume"],"answer":2,"explain":"A force has magnitude <i>and<\/i> direction. Mass, time and volume have magnitude only, so they are scalars."},{"type":"num","q":"A replacement pump has a mass of 250 kg. What is its weight?","answer":2.4525,"display":"2.45","unit":"kN","tol":2.0,"explain":"W = mg = 250 × 9.81 = 2 452 N = 2.45 kN."},{"type":"mc","q":"The equilibrant of a force system is:","options":["The largest force in the system","Equal in size to the resultant, on the same line of action, but in the opposite direction","The sum of the magnitudes of all the forces","Always perpendicular to the resultant"],"answer":1,"explain":"The equilibrant is the single force that balances the system. It cancels the resultant exactly, so it has the same size and line and points the opposite way."},{"type":"mc","q":"0.005 MN is the same as:","options":["5 N","50 N","5 kN","50 kN"],"answer":2,"explain":"0.005 × 10⁶ N = 5000 N = 5 kN."},{"type":"num","q":"Two tugs pull a ship. One pulls with 40 kN and the other with 30 kN, and the angle between their towlines is 50°. What is the magnitude of the resultant pull?","answer":63.582154,"display":"63.6","unit":"kN","tol":2.0,"explain":"With θ the angle between the forces, R = √(A² + B² + 2AB cos θ) = √(40² + 30² + 2·40·30·cos 50°) = 63.6 kN. If you use the cosine rule on the force triangle instead, the included angle is 180° − 50° = 130°, which gives the same answer."},{"type":"num","q":"For the same two tugs, what angle does the resultant make with the 40 kN towline?","answer":21.188851,"display":"21.2","unit":"°","tol":2.0,"explain":"Sine rule on the force triangle: sin α = 30·sin(130°)/63.58, which gives α = 21.2°. Note that sin 130° = sin 50°.","abs_tol":1.0},{"type":"num","q":"A 12 kN force acts at 35° above the horizontal. What is its horizontal component?","answer":9.829825,"display":"9.83","unit":"kN","tol":2.0,"explain":"F<sub>x<\/sub> = 12 cos 35° = 9.83 kN."},{"type":"num","q":"A 500 N force acts along a slope that rises 3 units for every 4 units of run (a 3-4-5 triangle). What is its vertical component?","answer":300,"display":"300","unit":"N","tol":2.0,"explain":"The hypotenuse is 5, so F<sub>y<\/sub> = 500 × 3/5 = 300 N."},{"type":"num","q":"Three forces act on a ring: 200 N at 0°, 300 N at 90° and 250 N at 225°, with angles measured anticlockwise from +x. What is the magnitude of the resultant?","answer":125.392602,"display":"125","unit":"N","tol":2.0,"explain":"ΣF<sub>x<\/sub> = 200 + 0 + 250 cos 225° = 23.22 N. ΣF<sub>y<\/sub> = 0 + 300 + 250 sin 225° = 123.2 N. F<sub>R<\/sub> = √(23.22² + 123.2²) = 125 N, acting at 79.3° from +x."},{"type":"mc","q":"Two forces of 30 N and 40 N act on a point. Which of these <i>cannot<\/i> be the magnitude of their resultant?","options":["5 N","10 N","50 N","70 N"],"answer":0,"explain":"The resultant lies between the difference (40 − 30 = 10 N, forces opposed) and the sum (70 N, forces in line). 50 N is the case where they are at 90°. 5 N is impossible."}]},{"n":2,"title":"Equilibrium of a particle and free-body diagrams","chapter":"Ch. 2.5–2.9 & 3","readings":[{"sec":"3.1–3.3","title":"Equilibrium, free-body diagrams, coplanar systems","pages":"book pp. 87–105 (PDF pp. 109–127)","depth":"core"},{"sec":"2.5–2.8","title":"Cartesian vectors, position vectors, force along a line","pages":"book pp. 44–68 (PDF pp. 66–90)","depth":"skim"},{"sec":"2.9","title":"Dot product","pages":"book pp. 69–86 (PDF pp. 91–108)","depth":"skim"},{"sec":"3.4","title":"Three-dimensional force systems","pages":"book pp. 106–120 (PDF pp. 128–142)","depth":"skim"}],"objectives":["Draw a clean free-body diagram (FBD) of a particle","Solve ΣFx = 0, ΣFy = 0 for unknown tensions","Use Lami's theorem for three-force problems and see why wide sling angles are dangerous","Handle springs (F = ks) and cables over pulleys","Read a force written as a Cartesian vector (i, j, k), and find components along a line"],"notes":[{"h":"Equilibrium of a particle","p":"A particle is in equilibrium when the resultant force on it is zero: <b>ΣF = 0<\/b>. In 2D that gives two equations, ΣF<sub>x<\/sub> = 0 and ΣF<sub>y<\/sub> = 0, so you can solve for at most <b>two unknowns<\/b>."},{"h":"The free-body diagram","p":"This is the most important skill in the course. (1) Draw the particle, such as a hook or a ring, isolated from everything around it. (2) Show <i>every<\/i> force acting on it: known loads, weights and the pulls of cables. (3) Label unknown magnitudes and mark every angle. If you assume a direction for an unknown and the answer comes out negative, the force acts the other way."},{"h":"Cables, pulleys and springs","p":"A cable can only <b>pull<\/b>, and its tension acts along the cable. Over a frictionless pulley the tension is the <b>same on both sides<\/b>. A linear spring has F = k·s, where s = deformed length − unstretched length. A positive s means the spring is stretched and pulling."},{"h":"Lami's theorem (exam favourite)","p":"When exactly three forces hold a point in equilibrium, each force is proportional to the sine of the angle between the other two: <b>F₁/sin α₁ = F₂/sin α₂ = F₃/sin α₃<\/b>. It's the sine rule applied to the closed force triangle, and it is quick for hook-and-two-slings problems."},{"h":"Sling angles","p":"For a load W hung from two equal legs, each at angle θ from the vertical: T = W / (2 cos θ). At θ = 30° each leg carries 0.577W. At θ = 60° (a 120° included angle) each leg carries the <b>full<\/b> W. Wider is worse, which is why riggers limit the included angle."},{"h":"Cartesian vectors (lighter touch)","p":"In 3D, write F = F<sub>x<\/sub><b>i<\/b> + F<sub>y<\/sub><b>j<\/b> + F<sub>z<\/sub><b>k<\/b>. To aim a force along a line from A to B: take the position vector r = (x<sub>B<\/sub>−x<sub>A<\/sub>)<b>i<\/b> + …, divide it by its length to get the unit vector u, then F = F·u. Direction cosines satisfy cos²α + cos²β + cos²γ = 1. The dot product A·B = AB cos θ gives the angle between two lines and the component of a force along a line. These exams are mostly 2D, so learn this well enough to follow it."}],"formulas":[["Particle equilibrium","ΣF<sub>x<\/sub> = 0,  ΣF<sub>y<\/sub> = 0  (ΣF<sub>z<\/sub> = 0 in 3D)"],["Lami's theorem","F₁/sin α₁ = F₂/sin α₂ = F₃/sin α₃"],["Symmetric two-leg sling","T = W / (2 cos θ)  (θ from vertical)"],["Linear spring","F = k s,  s = L − L₀"],["Force along a line","F = F·(r / |r|)"],["Direction cosines","cos²α + cos²β + cos²γ = 1"],["Dot product","A·B = AB cos θ = A<sub>x<\/sub>B<sub>x<\/sub> + A<sub>y<\/sub>B<sub>y<\/sub> + A<sub>z<\/sub>B<sub>z<\/sub>"]],"example":{"title":"Lifting an engine block with two slings","problem":"A 2000 kg engine block hangs from a crane hook on two slings. Sling AB is 30° from the vertical, on the left. Sling AC is 45° from the vertical, on the right. Find the tension in each sling.","steps":["Weight: W = 2000 × 9.81 = <b>19.6 kN<\/b>.","FBD of the hook A: T<sub>AB<\/sub> up and to the left at 30° from vertical, T<sub>AC<\/sub> up and to the right at 45° from vertical, and W straight down.","ΣF<sub>x<\/sub> = 0: T<sub>AC<\/sub> sin 45° − T<sub>AB<\/sub> sin 30° = 0","ΣF<sub>y<\/sub> = 0: T<sub>AB<\/sub> cos 30° + T<sub>AC<\/sub> cos 45° − W = 0","Or use Lami directly. The angle opposite T<sub>AB<\/sub> (between T<sub>AC<\/sub> and W) is 180° − 45° = 135°. Opposite T<sub>AC<\/sub> it is 180° − 30° = 150°. Opposite W it is 30° + 45° = 75°.","T<sub>AB<\/sub> = W sin 135° / sin 75° = <b>14.4 kN<\/b>","T<sub>AC<\/sub> = W sin 150° / sin 75° = <b>10.2 kN<\/b>"],"answer":"T<sub>AB<\/sub> = 14.4 kN, T<sub>AC<\/sub> = 10.2 kN. The sling nearer the vertical takes more of the load."},"marine":"This is chain-block and sling work in the engine room: lifting a cylinder head or a pump motor off padeyes. Every 'max load' problem here is really a safe-working-load check. The sling-angle rule, that each leg carries W at a 120° included angle, is worth knowing for the job as well as the exam.","practice":[{"set":"Preliminary","items":"P3–1, P3–2","where":"book p. 96; solutions p. 638"},{"set":"Fundamental","items":"F3–1 to F3–6 (core), F2–13 to F2–16 & F3–7, F3–8 (3D, optional)","where":"book pp. 51, 97, 111; solutions p. 620"},{"set":"Review","items":"R3–1 to R3–4","where":"book p. 118; solutions p. 648"}],"test":[{"type":"mc","q":"A particle is in equilibrium when:","options":["It is not moving","The resultant force on it is zero","All the forces acting on it are equal","It has no weight"],"answer":1,"explain":"Equilibrium means ΣF = 0. A body moving at constant velocity is also in equilibrium, so 'not moving' is not the definition."},{"type":"mc","q":"A rope passes over a frictionless pulley. The tension on the two sides of the pulley is:","options":["Greater on the loaded side","The same on both sides","Half on each side","Zero on the free side"],"answer":1,"explain":"A frictionless pulley only changes the direction of the rope. The tension is the same throughout."},{"type":"mc","q":"A load hangs from two equal sling legs. As the included angle between the legs increases from 60° to 120°, the tension in each leg:","options":["Decreases","Stays the same","Increases, from about 0.58W to 1.0W","Doubles from 0.5W to 1.0W"],"answer":2,"explain":"T = W/(2 cos θ), with θ measured from the vertical. θ = 30° gives 0.577W and θ = 60° gives 1.0W."},{"type":"num","q":"A 500 kg load hangs from two sling legs, each 30° from the vertical. What is the tension in each leg?","answer":2.831903,"display":"2.83","unit":"kN","tol":2.0,"explain":"W = 500 × 9.81 = 4 905 N. T = W/(2 cos 30°) = 2.83 kN."},{"type":"num","q":"The same 500 kg load is now rigged with each leg at 60° from the vertical. What is the tension in each leg?","answer":4.905,"display":"4.9","unit":"kN","tol":2.0,"explain":"T = 4 905/(2 cos 60°) = 4.90 kN. That equals the full weight of the load."},{"type":"num","q":"A 10 kN weight hangs from point A. Cable AB runs horizontally to a wall. Cable AC rises at 40° above the horizontal to the deckhead. What is the tension in AC?","answer":15.557238,"display":"15.6","unit":"kN","tol":2.0,"explain":"ΣF<sub>y<\/sub>: T<sub>AC<\/sub> sin 40° = 10, so T<sub>AC<\/sub> = 15.6 kN."},{"type":"num","q":"In the same setup, what is the tension in the horizontal cable AB?","answer":11.917536,"display":"11.9","unit":"kN","tol":2.0,"explain":"ΣF<sub>x<\/sub>: T<sub>AB<\/sub> = T<sub>AC<\/sub> cos 40° = 10/tan 40° = 11.9 kN."},{"type":"num","q":"A spring with stiffness k = 2 kN/m has an unstretched length of 300 mm. It is stretched to 450 mm. What force does it exert?","answer":300,"display":"300","unit":"N","tol":2.0,"explain":"s = 0.450 − 0.300 = 0.150 m. F = ks = 2000 × 0.150 = 300 N."},{"type":"num","q":"A 600 N force acts from the origin toward the point (3, 4, 12) m. What is its z-component?","answer":553.846154,"display":"554","unit":"N","tol":2.0,"explain":"|r| = √(3² + 4² + 12²) = 13 m. F<sub>z<\/sub> = 600 × 12/13 = 554 N."},{"type":"mc","q":"A force has direction angles α = 60° and β = 60°. Its third direction angle γ (acute) is:","options":["30°","45°","60°","90°"],"answer":1,"explain":"cos²γ = 1 − cos²60° − cos²60° = 1 − 0.25 − 0.25 = 0.5, so cos γ = 0.707 and γ = 45°."}]},{"n":3,"title":"Moments of a force","chapter":"Ch. 4.1–4.5","readings":[{"sec":"4.1","title":"Moment of a force, scalar form","pages":"book pp. 121–124 (PDF pp. 143–146)","depth":"core"},{"sec":"4.4","title":"Principle of moments (Varignon)","pages":"book pp. 132–144 (PDF pp. 154–166)","depth":"core"},{"sec":"4.2–4.3","title":"Cross product and vector moments","pages":"book pp. 125–131 (PDF pp. 147–153)","depth":"skim"},{"sec":"4.5","title":"Moment about a specified axis","pages":"book pp. 145–153 (PDF pp. 167–175)","depth":"skim"}],"objectives":["Calculate a moment as force × perpendicular distance, with a sign","Use Varignon's principle: the moment of a force equals the sum of the moments of its components","Find a resultant moment from several forces","Set up r × F for a simple 3D case"],"notes":[{"h":"What a moment is","p":"A moment is the turning effect of a force about a point or an axis. In scalar form, <b>M<sub>O<\/sub> = F·d<\/b>, where d is the <b>perpendicular<\/b> distance from O to the force's <i>line of action<\/i>. The units are N·m or kN·m. Don't confuse a moment with work (J). They share base units, but they are different things."},{"h":"Sign convention","p":"Pick one convention and keep to it. The book uses <b>anticlockwise (CCW) = positive<\/b>, which is the right-hand rule with the thumb out of the page. A force whose line of action passes through O has zero moment about O."},{"h":"Principle of moments (Varignon)","p":"The moment of a force about a point equals the sum of the moments of its components about that point. In practice, split F into F<sub>x<\/sub> and F<sub>y<\/sub>, which are easy because their perpendicular distances are just coordinates: <b>M<sub>O<\/sub> = x·F<sub>y<\/sub> − y·F<sub>x<\/sub><\/b>. This is often faster than finding d."},{"h":"Resultant moment","p":"Add the moments of all the forces about the same point with their signs: (M<sub>R<\/sub>)<sub>O<\/sub> = ΣF·d. A negative answer means the net turning is clockwise."},{"h":"Vector form (lighter touch)","p":"<b>M<sub>O<\/sub> = r × F<\/b>, where r runs from O to <i>any<\/i> point on the line of action. Work out the 3×3 determinant with rows i j k / r<sub>x<\/sub> r<sub>y<\/sub> r<sub>z<\/sub> / F<sub>x<\/sub> F<sub>y<\/sub> F<sub>z<\/sub>. The moment about an axis with unit vector u is M<sub>a<\/sub> = u·(r × F). It matters for shafts and hinges, but exam questions are mostly planar."}],"formulas":[["Scalar moment","M<sub>O<\/sub> = F d  (d ⟂ to line of action)"],["Force at an angle φ to a lever of length L","M = F L sin φ"],["Varignon (2D)","M<sub>O<\/sub> = x F<sub>y<\/sub> − y F<sub>x<\/sub>"],["Resultant moment","(M<sub>R<\/sub>)<sub>O<\/sub> = Σ F d  (CCW +)"],["Vector moment","M<sub>O<\/sub> = r × F"],["Moment about an axis","M<sub>a<\/sub> = u<sub>a<\/sub> · (r × F)"]],"example":{"title":"Torque on a flange bolt, two ways","problem":"(a) An engineer pulls on a 0.3 m spanner with 400 N at 75° to the handle. What torque does the bolt get? (b) A 2 kN force with components F<sub>x<\/sub> = 1.2 kN and F<sub>y<\/sub> = 1.6 kN acts at the point (3, 2) m. Find its moment about the origin O.","steps":["(a) Only the component perpendicular to the handle turns the bolt: M = F L sin φ = 400 × 0.3 × sin 75° = <b>116 N·m<\/b>.","(b) Use Varignon with components. F<sub>y<\/sub> = 1.6 kN acts at x = 3 m and turns anticlockwise (+). F<sub>x<\/sub> = 1.2 kN acts at y = 2 m and turns clockwise (−).","M<sub>O<\/sub> = x F<sub>y<\/sub> − y F<sub>x<\/sub> = 3(1.6) − 2(1.2) = 4.8 − 2.4 = <b>2.40 kN·m<\/b>, anticlockwise."],"answer":"(a) 116 N·m. (b) 2.40 kN·m anticlockwise."},"marine":"This covers torquing flange and cylinder-head bolts, valve hand wheels, the turning moment on a rudder stock, and the overturning moment a provisions crane puts on its pedestal. 'Force × perpendicular distance' is behind every lever, crank and tiller you'll meet.","practice":[{"set":"Preliminary","items":"P4–1 to P4–4","where":"book pp. 135 & 150; solutions p. 638"},{"set":"Fundamental","items":"F4–1 to F4–12 (core), F4–13 to F4–18 (optional)","where":"book pp. 136–137, 151; solutions p. 620"},{"set":"Review","items":"R4–1, R4–3","where":"book p. 204; solutions p. 648"}],"test":[{"type":"mc","q":"The SI unit of a moment is:","options":["N","N/m","N·m","J/s"],"answer":2,"explain":"Moment = force × distance, so N·m (or kN·m)."},{"type":"mc","q":"The moment of a force about a point is zero when:","options":["The force is very small","The line of action of the force passes through the point","The force is horizontal","The force is perpendicular to the lever"],"answer":1,"explain":"If the line of action passes through the point, the perpendicular distance d = 0, so M = 0."},{"type":"num","q":"A 250 N force is applied perpendicular to a spanner, 0.4 m from the bolt centre. What torque does the bolt get?","answer":100,"display":"100","unit":"N·m","tol":2.0,"explain":"M = Fd = 250 × 0.4 = 100 N·m."},{"type":"num","q":"The same 250 N force is applied at 0.4 m, but at 60° to the spanner handle. What is the torque now?","answer":86.60254,"display":"86.6","unit":"N·m","tol":2.0,"explain":"M = F L sin φ = 250 × 0.4 × sin 60° = 86.6 N·m."},{"type":"num","q":"A force F = (300 <b>i<\/b> − 200 <b>j<\/b>) N acts at the point (2, 3) m. Find its moment about the origin. Give a signed answer with anticlockwise positive.","answer":-1300,"display":"−1 300","unit":"N·m","tol":2.0,"explain":"M<sub>O<\/sub> = xF<sub>y<\/sub> − yF<sub>x<\/sub> = 2(−200) − 3(300) = −400 − 900 = −1300 N·m, which is 1300 N·m clockwise."},{"type":"num","q":"A crane boom 10 m long is raised to 40° above the horizontal. A 5 kN load hangs from its tip. What moment does the load produce about the boom foot?","answer":38.302222,"display":"38.3","unit":"kN·m","tol":2.0,"explain":"The load acts vertically, so d is the horizontal reach: 10 cos 40° = 7.66 m. M = 5 × 7.66 = 38.3 kN·m."},{"type":"num","q":"Position vector r = (1 <b>i<\/b> + 2 <b>j<\/b>) m and force F = (50 <b>k<\/b>) N. What is the magnitude of the moment M = r × F?","answer":111.803399,"display":"112","unit":"N·m","tol":2.0,"explain":"r × F = (2·50 − 0)<b>i<\/b> − (1·50 − 0)<b>j<\/b> + 0<b>k<\/b> = (100<b>i<\/b> − 50<b>j<\/b>) N·m. |M| = √(100² + 50²) = 112 N·m."},{"type":"mc","q":"Varignon's theorem states that:","options":["A force can slide along its line of action","The moment of a force equals the sum of the moments of its components about the same point","Every action has an equal and opposite reaction","Couples can be moved anywhere"],"answer":1,"explain":"This is the principle of moments. Option A is transmissibility, option C is Newton's 3rd law, and option D is a property of couples."},{"type":"num","q":"A lever has two forces on it: 200 N acting anticlockwise at 0.5 m from the pivot, and 150 N acting clockwise at 1.2 m. What is the resultant moment? Give a signed answer with anticlockwise positive.","answer":-80,"display":"−80","unit":"N·m","tol":2.0,"explain":"ΣM = +200(0.5) − 150(1.2) = 100 − 180 = −80 N·m, which is 80 N·m clockwise."},{"type":"mc","q":"The perpendicular distance used in M = Fd is measured from the point to:","options":["The point where the force is applied","The line of action of the force","The nearest support","The centroid of the body"],"answer":1,"explain":"d is the shortest distance from the point to the force's line of action, not to where the force happens to be drawn."}]},{"n":4,"title":"Couples, equivalent systems and distributed loads","chapter":"Ch. 4.6–4.9","readings":[{"sec":"4.6","title":"Moment of a couple","pages":"book pp. 154–165 (PDF pp. 176–187)","depth":"core"},{"sec":"4.7–4.8","title":"Simplifying force and couple systems","pages":"book pp. 166–189 (PDF pp. 188–211)","depth":"core"},{"sec":"4.9","title":"Reducing a simple distributed load","pages":"book pp. 190–206 (PDF pp. 212–228)","depth":"core"}],"objectives":["Recognise a couple and calculate its moment","Move a force to another point by adding a couple","Replace parallel forces with a single resultant and find where it acts","Turn uniform, triangular and trapezoidal loads into equivalent point loads"],"notes":[{"h":"Couples","p":"A <b>couple<\/b> is two parallel forces that are equal in size, opposite in direction, and a distance d apart. They have zero resultant force but a turning effect of <b>M = F·d<\/b>. A couple moment is a <b>free vector<\/b>: it has the same value about every point, so you can move it anywhere on the body."},{"h":"Moving a force","p":"You can slide a force along its own line of action without changing anything. This is transmissibility. To move it <i>off<\/i> its line to a point O, add a couple equal to the moment the force had about O: M = F·d. A force-and-couple system at O is equivalent to the original force."},{"h":"Resultant of parallel forces","p":"For vertical loads on a beam: F<sub>R<\/sub> = ΣF. Find its position by matching moments: <b>x̄ = Σ(F·x) / ΣF<\/b>. This is the same idea as finding a centre of gravity, which comes in week 10."},{"h":"Distributed loads","p":"A load spread along a length, w in kN/m, is equivalent to a single force equal to the <b>area under the load diagram<\/b>, acting through the <b>centroid<\/b> of that area. Uniform (UDL): F = wL at L/2. Triangular from 0 to w₀: F = ½w₀L at 2L/3 from the zero end, which is L/3 from the heavy end. Treat a trapezoid as a rectangle plus a triangle."}],"formulas":[["Couple moment","M = F d  (free vector)"],["Force moved to O","F at O + couple M = F d"],["Parallel resultant","F<sub>R<\/sub> = ΣF,  x̄ = Σ(F x) / ΣF"],["Uniform load","F = wL  at L/2"],["Triangular load","F = ½ w₀ L  at L/3 from the w₀ end"],["Any distributed load","F<sub>R<\/sub> = ∫w dx,  x̄ = ∫x w dx / ∫w dx"]],"example":{"title":"Deck beam under stores and a pallet","problem":"A 6 m deck beam AB carries a uniform load of stores of 4 kN/m along its full length, plus a 10 kN pallet 2 m from A. Replace all of this with a single resultant force and give its position from A.","steps":["Uniform load → 4 × 6 = 24 kN acting at 3 m from A.","Total: F<sub>R<\/sub> = 24 + 10 = <b>34 kN<\/b>, downward.","Moments about A: 24(3) + 10(2) = 72 + 20 = 92 kN·m.","x̄ = 92 / 34 = <b>2.71 m<\/b> from A."],"answer":"F<sub>R<\/sub> = 34 kN downward, acting 2.71 m from A."},"marine":"Turning distributed loads into point loads is the first step in every beam problem: cargo on a hatch cover, tank contents on a floor plate, or water pressure on a bulkhead, which is a triangular load. Propeller torque and a steering-gear rudder moment are couples. Next week you use these resultants to find support reactions.","practice":[{"set":"Preliminary","items":"P4–5 to P4–7","where":"book pp. 172 & 184; solutions p. 638"},{"set":"Fundamental","items":"F4–19 to F4–21, F4–25 to F4–28, F4–31 to F4–34, F4–37 to F4–40","where":"book pp. 160, 173, 185, 195; solutions p. 620"},{"set":"Review","items":"R4–5 to R4–8","where":"book p. 204; solutions p. 648"}],"test":[{"type":"mc","q":"A couple moment is called a 'free vector' because:","options":["It has no magnitude","It has the same moment about every point, so it can be moved anywhere on the body","It can only act about the centroid","It is always zero"],"answer":1,"explain":"The moment of a couple, F·d, does not depend on the point you take moments about."},{"type":"num","q":"Two opposite 150 N forces act along parallel lines 0.25 m apart. What is the couple moment?","answer":37.5,"display":"37.5","unit":"N·m","tol":2.0,"explain":"M = Fd = 150 × 0.25 = 37.5 N·m."},{"type":"num","q":"A 12 kN force acts 0.8 m from point O. You replace it with an equal force acting at O plus a couple. How big is the couple?","answer":9.6,"display":"9.6","unit":"kN·m","tol":2.0,"explain":"M = Fd = 12 × 0.8 = 9.6 kN·m."},{"type":"num","q":"A uniform load of 5 kN/m acts over 8 m. What is the equivalent resultant force?","answer":40,"display":"40","unit":"kN","tol":2.0,"explain":"F = wL = 5 × 8 = 40 kN, acting at 4 m."},{"type":"num","q":"A triangular load rises from 0 at A to 9 kN/m at B, over 6 m. What is the resultant force?","answer":27,"display":"27","unit":"kN","tol":2.0,"explain":"F = ½ × 9 × 6 = 27 kN."},{"type":"num","q":"For the same triangular load, how far from A does the resultant act?","answer":4,"display":"4","unit":"m","tol":2.0,"explain":"The centroid of a triangle is ⅔ of the way from the zero end: ⅔ × 6 = 4 m from A, which is 2 m from B."},{"type":"num","q":"Three parallel downward loads act on a beam: 2 kN at x = 1 m, 5 kN at x = 3 m and 3 kN at x = 6 m. Where does their 10 kN resultant act?","answer":3.5,"display":"3.5","unit":"m","tol":2.0,"explain":"x̄ = (2·1 + 5·3 + 3·6)/10 = 35/10 = 3.50 m."},{"type":"mc","q":"A force can be moved along its own line of action without changing its external effect on a rigid body. This is the principle of:","options":["Moments","Transmissibility","Superposition","Virtual work"],"answer":1,"explain":"This is transmissibility."},{"type":"num","q":"A plate has a 40 N·m anticlockwise couple, a 25 N·m clockwise couple, and a couple made of two 100 N forces 0.3 m apart acting clockwise. What is the net couple moment? Give a signed answer with anticlockwise positive.","answer":-15,"display":"−15","unit":"N·m","tol":2.0,"explain":"ΣM = +40 − 25 − (100 × 0.3) = 40 − 25 − 30 = −15 N·m, which is 15 N·m clockwise."},{"type":"num","q":"A trapezoidal load goes from 2 kN/m at A to 6 kN/m at B over 4 m. How far from A does its resultant act?","answer":2.333333,"display":"2.33","unit":"m","tol":2.0,"explain":"Rectangle: 2 × 4 = 8 kN at 2 m. Triangle: ½ × 4 × 4 = 8 kN at ⅔ × 4 = 2.667 m. x̄ = (8·2 + 8·2.667)/16 = 2.33 m. The resultant is 16.0 kN."}]},{"n":5,"title":"Equilibrium of a rigid body","chapter":"Ch. 5","readings":[{"sec":"5.1–5.2","title":"Conditions for equilibrium, free-body diagrams","pages":"book pp. 207–219 (PDF pp. 229–241)","depth":"core"},{"sec":"5.3–5.4","title":"Equations of equilibrium, two- and three-force members","pages":"book pp. 220–244 (PDF pp. 242–266)","depth":"core"},{"sec":"5.5–5.7","title":"3D equilibrium, constraints, statical determinacy","pages":"book pp. 245–272 (PDF pp. 267–294)","depth":"skim"}],"objectives":["Draw the correct reactions for rollers, pins and fixed supports","Solve the three equilibrium equations ΣFx = 0, ΣFy = 0, ΣM = 0","Choose moment points that remove unknowns","Recognise two-force members and use them to simplify problems","Tell whether a structure is statically determinate"],"notes":[{"h":"Three equations","p":"A rigid body in 2D is in equilibrium when <b>ΣF<sub>x<\/sub> = 0, ΣF<sub>y<\/sub> = 0 and ΣM<sub>O<\/sub> = 0<\/b>. That gives three equations, so at most three unknowns. Take moments about a point where two unknowns act, so that each equation has only one unknown."},{"h":"Support reactions","p":"A support pushes back in each direction it stops the body moving. <b>Roller or smooth surface<\/b>: 1 force, perpendicular to the surface. <b>Pin or hinge<\/b>: 2 force components, A<sub>x<\/sub> and A<sub>y<\/sub>. <b>Fixed support<\/b> (built-in, welded): 2 forces plus a moment, M<sub>A<\/sub>. A cable gives 1 tension along the cable."},{"h":"Free-body diagram for a rigid body","p":"Draw the body on its own. Replace every support with its reactions. Add the weight at the centre of gravity and replace each distributed load with its resultant (week 4). Show all the dimensions you'll need for moments. An unknown that comes out negative just acts the other way."},{"h":"Two- and three-force members","p":"A <b>two-force member<\/b> has forces applied at only two points and no weight. For equilibrium those two forces must be equal, opposite and <b>along the line joining the two points<\/b>. Links, struts and topping lifts are like this, so their direction is known straight away. In a <b>three-force member<\/b>, the three forces must meet at one point or all be parallel."},{"h":"Determinacy and constraints","p":"When there are more unknown reactions than equations, the body is <b>statically indeterminate<\/b>, like a shaft on three bearings. Statics alone can't solve it. When reactions are all parallel or all meet at one point, the body is <b>improperly constrained<\/b> and can move even if there are enough supports."}],"formulas":[["2D equilibrium","ΣF<sub>x<\/sub> = 0,  ΣF<sub>y<\/sub> = 0,  ΣM<sub>O<\/sub> = 0"],["Roller / pin / fixed","1 / 2 / 3 unknowns (fixed adds M)"],["Simply supported, point load P at a from A (span L)","R<sub>B<\/sub> = P a / L,  R<sub>A<\/sub> = P (L − a)/L"],["Cantilever, end load P","R = P,  M<sub>wall<\/sub> = P L"],["Cantilever, UDL w","R = wL,  M<sub>wall<\/sub> = wL²/2"],["Lever","F₁ d₁ = F₂ d₂"]],"example":{"title":"Reactions on a pump skid beam","problem":"A simply supported beam AB spans 6 m, with a pin at A and a roller at B. It carries a 12 kN point load 2 m from A and a uniform load of 3 kN/m over the last 2 m, from x = 4 m to 6 m. Find the reactions.","steps":["Resultant of the uniform load: 3 × 2 = 6 kN, acting at x = 5 m.","There are no horizontal loads, so A<sub>x<\/sub> = 0.","ΣM<sub>A<\/sub> = 0: R<sub>B<\/sub>(6) − 12(2) − 6(5) = 0, so R<sub>B<\/sub> = 54/6 = <b>9.00 kN<\/b>.","ΣF<sub>y<\/sub> = 0: R<sub>A<\/sub> + R<sub>B<\/sub> − 12 − 6 = 0, so R<sub>A<\/sub> = <b>9.00 kN<\/b>.","Check with ΣM<sub>B<\/sub> = 0: −9(6) + 12(4) + 6(1) = −54 + 48 + 6 = 0 ✓"],"answer":"R<sub>A<\/sub> = 9.00 kN up, A<sub>x<\/sub> = 0, R<sub>B<\/sub> = 9.00 kN up."},"marine":"This covers bearing loads on a line shaft, reactions under a pump or motor sitting on a skid, the pin forces at a derrick heel, and the tension in a topping lift. The topping lift is a classic two-force member. Next week's trusses and the week 7 bending moments both start from reactions, so get fluent here.","practice":[{"set":"Preliminary","items":"P5–1","where":"book p. 232; solutions p. 638"},{"set":"Fundamental","items":"F5–1 to F5–6","where":"book p. 233; solutions p. 620"},{"set":"Review","items":"R5–1 to R5–4","where":"book p. 270; solutions p. 648"}],"test":[{"type":"mc","q":"How many unknown reactions does a fixed (built-in) support have in 2D?","options":["1","2","3","4"],"answer":2,"explain":"Two force components plus a moment: A<sub>x<\/sub>, A<sub>y<\/sub> and M<sub>A<\/sub>."},{"type":"mc","q":"A roller support provides:","options":["A force perpendicular to the surface it rolls on","Horizontal and vertical forces","A moment only","A force parallel to the surface"],"answer":0,"explain":"A roller only stops motion into or away from the surface."},{"type":"num","q":"A simply supported beam spans 5 m and carries a 20 kN load 2 m from A. What is the reaction at A?","answer":12,"display":"12","unit":"kN","tol":2.0,"explain":"ΣM<sub>B<\/sub>: R<sub>A<\/sub>(5) = 20(3), so R<sub>A<\/sub> = 12 kN. Then R<sub>B<\/sub> = 8 kN."},{"type":"num","q":"A 3 m cantilever is fixed at A. It carries a 4 kN load at the free end and a uniform load of 2 kN/m along its full length. What is the moment at the fixed support?","answer":21.0,"display":"21","unit":"kN·m","tol":2.0,"explain":"M<sub>A<\/sub> = 4(3) + (2 × 3)(1.5) = 12 + 9 = 21 kN·m."},{"type":"num","q":"For the same cantilever, what is the vertical reaction at A?","answer":10,"display":"10","unit":"kN","tol":2.0,"explain":"A<sub>y<\/sub> = 4 + 2 × 3 = 10 kN."},{"type":"num","q":"A beam has supports at A (x = 0) and B (x = 4 m), and a 6 kN load at the end of a 2 m overhang (x = 6 m). What is the vertical reaction at A? Give a signed answer with up positive.","answer":-3,"display":"−3","unit":"kN","tol":2.0,"explain":"ΣM<sub>B<\/sub>: −R<sub>A<\/sub>(4) − 6(2) = 0, so R<sub>A<\/sub> = −3 kN. That means A has to be held <i>down<\/i> with 3 kN. R<sub>B<\/sub> = 9 kN."},{"type":"mc","q":"A two-force member (no weight, loaded at two points only) carries forces that are:","options":["Perpendicular to the member","Equal, opposite and along the line joining the two points","Always in tension","Unknown in direction until you solve"],"answer":1,"explain":"Only collinear, equal and opposite forces can give both ΣF = 0 and ΣM = 0."},{"type":"num","q":"A 1.5 m hand-pump lever pivots 0.3 m from the pump rod end. A 200 N force is applied at the handle end. What force goes into the pump rod?","answer":800,"display":"800","unit":"N","tol":2.0,"explain":"Lever: 200 × (1.5 − 0.3) = F × 0.3, so F = 240/0.3 = 800 N."},{"type":"num","q":"A horizontal beam AB, 4 m long, is pinned at A. At B it is held by a cable that makes 30° with the beam. A 10 kN load acts at mid-span. What is the cable tension?","answer":10.0,"display":"10","unit":"kN","tol":2.0,"explain":"ΣM<sub>A<\/sub>: (T sin 30°)(4) = 10(2), so T = 10.0 kN."},{"type":"num","q":"For the same beam, what is the horizontal pin reaction at A?","answer":8.660254,"display":"8.66","unit":"kN","tol":2.0,"explain":"ΣF<sub>x<\/sub>: A<sub>x<\/sub> = T cos 30° = 8.66 kN."}]},{"n":6,"title":"Trusses, frames and machines","chapter":"Ch. 6","readings":[{"sec":"6.1–6.3","title":"Simple trusses, method of joints, zero-force members","pages":"book pp. 273–290 (PDF pp. 295–312)","depth":"core"},{"sec":"6.4","title":"Method of sections","pages":"book pp. 291–300 (PDF pp. 313–322)","depth":"core"},{"sec":"6.6","title":"Frames and machines","pages":"book pp. 305–342 (PDF pp. 327–364)","depth":"core"},{"sec":"6.5","title":"Space trusses","pages":"book pp. 301–304 (PDF pp. 323–326)","depth":"skip"}],"objectives":["State the assumptions behind truss analysis","Find member forces by the method of joints and label them tension or compression","Spot zero-force members by inspection","Cut a section and use one moment equation to get a member force directly","Take apart a frame or machine and find pin forces and mechanical advantage"],"notes":[{"h":"Truss assumptions","p":"Members are joined by smooth pins, loads act only at the joints, and member weights are ignored or shared out to the joints. That makes every member a <b>two-force member<\/b> carrying pure <b>tension (T)<\/b> or <b>compression (C)<\/b> along its length."},{"h":"Method of joints","p":"Find the support reactions first. Then go joint by joint, starting at one with <b>no more than two unknowns<\/b>, using ΣF<sub>x<\/sub> = 0 and ΣF<sub>y<\/sub> = 0. Assume every unknown member is in tension, pulling away from the joint. A negative answer means compression."},{"h":"Zero-force members","p":"(1) At a joint with only two members that aren't in line and no load, <b>both<\/b> members carry zero. (2) At a joint with three members where two are in line and there's no load, the <b>third<\/b> member carries zero. Spot these first to save work."},{"h":"Method of sections","p":"Cut the truss through the member you want, cutting <b>no more than three<\/b> unknown members. Take one side as a free body. Take moments about the point where the other two cut members meet, and the force you want falls out of one equation."},{"h":"Frames and machines","p":"These contain at least one <b>multi-force member<\/b>, so the members are no longer simple two-force members. Take the structure apart. At each pin, the forces on the two members are equal and opposite (Newton's 3rd law). Spot any two-force members first, since their direction is known. A machine changes an input force into an output force. Its <b>mechanical advantage<\/b> is output ÷ input."}],"formulas":[["Each joint","ΣF<sub>x<\/sub> = 0,  ΣF<sub>y<\/sub> = 0"],["Each section","ΣF<sub>x<\/sub> = 0,  ΣF<sub>y<\/sub> = 0,  ΣM = 0  (≤ 3 cut members)"],["Member force from its y-part","F = F<sub>y<\/sub> × (length / rise)"],["Chord force by sections","F<sub>chord<\/sub> = M<sub>section<\/sub> / depth"],["Mechanical advantage","MA = F<sub>out<\/sub> / F<sub>in<\/sub>"]],"example":{"title":"A triangular jib frame","problem":"A simple triangular truss has supports A (pin) and C (roller) 6 m apart. Its apex B is 4 m above the mid-point of AC, and a 10 kN load hangs from B. Find the forces in AB and AC.","steps":["Reactions: the truss is symmetric, so A<sub>y<\/sub> = C<sub>y<\/sub> = 5 kN and A<sub>x<\/sub> = 0.","Geometry of AB: run 3 m, rise 4 m, length 5 m, at θ = 53.1° to the horizontal.","Joint A, ΣF<sub>y<\/sub>: 5 + F<sub>AB<\/sub> sin θ = 0, so F<sub>AB<\/sub> = −5 × 5/4 = <b>-6.25 kN<\/b>. The minus sign means it is <b>compression<\/b>.","Joint A, ΣF<sub>x<\/sub>: F<sub>AC<\/sub> + F<sub>AB<\/sub> cos θ = 0, so F<sub>AC<\/sub> = 6.25 × 3/5 = <b>3.75 kN (T)<\/b>."],"answer":"F<sub>AB<\/sub> = 6.25 kN (C), F<sub>AC<\/sub> = 3.75 kN (T). By symmetry BC = 6.25 kN (C)."},"marine":"Cargo derricks, crane jibs, A-frames, overhead lifting beams with their hangers, and hatch-cover frames are all trusses or frames. Most engine-room tools are machines: chain blocks, pipe wrenches, valve-spindle levers. Trusses get less weight than beams and friction in the Applied Mechanics exams, so treat this as solid practice in equilibrium rather than something to memorise.","practice":[{"set":"Preliminary","items":"P6–1 to P6–3","where":"book pp. 285 & 321; solutions p. 638"},{"set":"Fundamental","items":"F6–1 to F6–12, F6–17 to F6–20","where":"book pp. 286, 297, 322–324; solutions p. 620"},{"set":"Review","items":"R6–1, R6–2, R6–3, R6–6, R6–8","where":"book p. 340; solutions p. 648"}],"test":[{"type":"mc","q":"Simple truss analysis assumes that:","options":["Members are rigidly welded","Members are joined by smooth pins and loads act only at joints, so each member carries only tension or compression","Every member carries bending","Joints can carry moments"],"answer":1,"explain":"These assumptions make every member a two-force member."},{"type":"mc","q":"At an unloaded joint where only two members meet, and they are not in line:","options":["Both members are zero-force members","Both carry equal tension","One is in tension and one in compression","You need the method of sections"],"answer":0,"explain":"ΣF = 0 in two directions with two non-parallel forces can only be met if both are zero."},{"type":"mc","q":"With the method of sections, the most unknown member forces you can generally cut and solve is:","options":["1","2","3","6"],"answer":2,"explain":"There are three equilibrium equations for the free section."},{"type":"num","q":"A triangular truss spans 8 m. Its apex is 3 m above mid-span and carries a 12 kN load. What is the magnitude of the force in one sloping member?","answer":10.0,"display":"10","unit":"kN","tol":2.0,"explain":"Reactions are 6 kN each. The member runs 4 m, rises 3 m and is 5 m long. F = 6 × 5/3 = 10 kN."},{"type":"mc","q":"The sloping members of that truss are in:","options":["Tension","Compression","Zero force","Bending"],"answer":1,"explain":"They push up against the apex load, so they are in compression. The bottom tie is in tension."},{"type":"num","q":"What is the force in the horizontal bottom tie of the same truss?","answer":8.0,"display":"8","unit":"kN","tol":2.0,"explain":"F<sub>tie<\/sub> = 10 × 4/5 = 8 kN (T)."},{"type":"num","q":"A section is cut through a truss of depth 2 m. Take moments about the top joint above the cut bottom chord. The left reaction is 30 kN at 6 m from the joint, and a 20 kN load acts 3 m from it. What is the force in the bottom chord?","answer":60.0,"display":"60","unit":"kN","tol":2.0,"explain":"F × 2 = 30(6) − 20(3) = 120, so F = 60.0 kN. It is in tension."},{"type":"num","q":"A pair of pliers has its handles gripped with 100 N each, applied 120 mm from the pivot. The jaws grip 30 mm from the pivot. What force is applied at the jaws?","answer":400,"display":"400","unit":"N","tol":2.0,"explain":"Moments about the pivot: 100 × 120 = F × 30, so F = 400 N. MA = 4."},{"type":"num","q":"A bell crank ABC pivots at B. Arm BA is 200 mm long and horizontal, and arm BC is 100 mm long and vertical. A 50 N vertical force acts at A. What horizontal force at C holds it in equilibrium?","answer":100,"display":"100","unit":"N","tol":2.0,"explain":"ΣM<sub>B<\/sub>: 50 × 200 = F × 100, so F = 100 N."},{"type":"mc","q":"When you take a frame apart, the forces at a pin connecting two members are:","options":["Twice as large on the longer member","Equal and opposite on the two members","Always vertical","Zero"],"answer":1,"explain":"This is Newton's 3rd law: action and reaction."}]},{"n":7,"title":"Internal forces: shear force and bending moment diagrams","chapter":"Ch. 7","readings":[{"sec":"7.1","title":"Internal loadings in members","pages":"book pp. 343–360 (PDF pp. 365–382)","depth":"core"},{"sec":"7.2","title":"Shear and moment equations and diagrams","pages":"book pp. 361–369 (PDF pp. 383–391)","depth":"core"},{"sec":"7.3","title":"Relations between load, shear and moment","pages":"book pp. 370–380 (PDF pp. 392–402)","depth":"core"},{"sec":"7.4","title":"Cables","pages":"book pp. 381–400 (PDF pp. 403–422)","depth":"skim"}],"objectives":["Find the internal normal force N, shear V and moment M at a section","Write V(x) and M(x) for a beam and draw the diagrams","Use dV/dx = w and dM/dx = V to sketch diagrams quickly","Find the maximum bending moment and where it occurs","Use the standard results for cantilevers and simply supported beams"],"notes":[{"h":"Why this matters","p":"Members fail where the internal bending moment is largest. Shear force and bending moment (SF and BM) diagrams for cantilevers and simply supported beams with point loads and uniform loads are a <b>named outcome<\/b> in the Applied Mechanics exams. Spend extra time here."},{"h":"Internal loadings","p":"Cut the member at the section you're interested in. Either piece is in equilibrium, so the cut face must carry a normal force <b>N<\/b>, a shear force <b>V<\/b> and a bending moment <b>M<\/b>. Find them with the three equilibrium equations on one piece, usually the simpler one."},{"h":"Sign convention (Hibbeler)","p":"Positive V makes the segment rotate clockwise. Positive M makes the beam <b>sag<\/b> (concave up), with the top in compression. A cantilever under downward load has <b>negative<\/b> moment, which is hogging. Exam papers sometimes use other conventions, so state yours and keep to it."},{"h":"The quick-sketch rules","p":"<b>Slope of the shear diagram = load intensity<\/b>: dV/dx = w, with w upward positive. So a UDL gives a sloping straight line, and a point load makes the shear diagram jump by the size of the load. <b>Slope of the moment diagram = shear<\/b>: dM/dx = V. So ΔM between two points = the area under the shear diagram. <b>M is a maximum where V = 0<\/b> or changes sign."},{"h":"Standard cases to memorise","p":"Simply supported, central point load P: M<sub>max<\/sub> = PL/4 at mid-span. Simply supported, UDL w: M<sub>max<\/sub> = wL²/8 at mid-span. Cantilever, end load P: M<sub>max<\/sub> = PL at the wall. Cantilever, UDL w: M<sub>max<\/sub> = wL²/2 at the wall."},{"h":"Hogging and sagging of a ship","p":"A ship's hull is a beam. Weight and buoyancy are distributed differently along the length, and that difference is the load. With heavy weight amidships, or a wave trough amidships, the hull <b>sags<\/b>: the deck is in compression and the keel in tension. With weight at the ends, or a wave crest amidships, it <b>hogs<\/b>. This is the same SF and BM idea on the biggest beam you'll ever work on."}],"formulas":[["Load–shear","dV/dx = w  (jump of P at a point load)"],["Shear–moment","dM/dx = V,  ΔM = area under V diagram"],["SS beam, central P","M<sub>max<\/sub> = PL/4"],["SS beam, UDL","M<sub>max<\/sub> = wL²/8,  V<sub>max<\/sub> = wL/2"],["SS beam, P at a from A","M<sub>max<\/sub> = P a (L − a) / L"],["Cantilever, end P","M<sub>max<\/sub> = PL,  V = P"],["Cantilever, UDL","M<sub>max<\/sub> = wL²/2,  V<sub>max<\/sub> = wL"]],"example":{"title":"A lifting beam under a uniform load","problem":"A simply supported beam spans 8 m and carries a uniform load of 5 kN/m. Write the equations for V(x) and M(x), and find the maximum moment.","steps":["Reactions: R<sub>A<\/sub> = R<sub>B<\/sub> = 5 × 8/2 = 20 kN.","Cut at x from A. From the left-hand piece: V(x) = 20 − 5x kN.","M(x) = 20x − 5x·(x/2) = 20x − 2.5x² kN·m.","V = 0 where 20 − 5x = 0, so x = 4 m, which is mid-span.","M<sub>max<\/sub> = 20(4) − 2.5(16) = <b>40 kN·m<\/b>. Check: wL²/8 = 5 × 64/8 = 40 ✓","Shape: V is a straight line from +20 to −20 kN. M is a parabola, 0 at each end and 40 at mid-span."],"answer":"V(x) = 20 − 5x kN, M(x) = 20x − 2.5x² kN·m, M<sub>max<\/sub> = 40 kN·m at x = 4 m."},"marine":"Line shafting between bearings, lifting beams, deck girders and the hull girder itself are all beams. SF and BM diagrams for cantilevers and simply supported beams are a listed Applied Mechanics exam outcome, and the same diagrams sit behind hogging and sagging in ship stability.","practice":[{"set":"Preliminary","items":"P7–1","where":"book p. 351; solutions p. 638"},{"set":"Fundamental","items":"F7–1 to F7–4, F7–7 to F7–12, F7–13 to F7–16","where":"book pp. 352, 365, 376; solutions p. 620"},{"set":"Review","items":"R7–1 to R7–5","where":"book p. 399; solutions p. 648"}],"test":[{"type":"num","q":"A simply supported beam spans 6 m with an 18 kN load at mid-span. What is the maximum bending moment?","answer":27,"display":"27","unit":"kN·m","tol":2.0,"explain":"M<sub>max<\/sub> = PL/4 = 18 × 6/4 = 27 kN·m."},{"type":"num","q":"A simply supported beam spans 10 m and carries a uniform load of 3 kN/m. What is the maximum bending moment?","answer":37.5,"display":"37.5","unit":"kN·m","tol":2.0,"explain":"M<sub>max<\/sub> = wL²/8 = 3 × 100/8 = 37.5 kN·m."},{"type":"num","q":"A 2.5 m cantilever carries an 8 kN load at its free end. What is the magnitude of the maximum bending moment?","answer":20,"display":"20","unit":"kN·m","tol":2.0,"explain":"M<sub>max<\/sub> = PL = 8 × 2.5 = 20 kN·m, at the wall. It is hogging, so negative in Hibbeler's convention."},{"type":"num","q":"A 4 m cantilever carries a uniform load of 1.5 kN/m. What is the maximum shear force?","answer":6,"display":"6","unit":"kN","tol":2.0,"explain":"V<sub>max<\/sub> = wL = 1.5 × 4 = 6 kN, at the wall."},{"type":"mc","q":"On a beam, the maximum bending moment occurs where:","options":["The shear force is largest","The shear force is zero or changes sign","The load is largest","The supports are"],"answer":1,"explain":"dM/dx = V, so M has a turning point where V = 0."},{"type":"mc","q":"The slope of the bending moment diagram at any point equals:","options":["The load intensity","The shear force at that point","The deflection","Zero"],"answer":1,"explain":"dM/dx = V."},{"type":"mc","q":"Over a length of beam carrying a uniform load, the shear and moment diagrams are:","options":["Both constant","Shear sloping straight line, moment parabola","Shear parabola, moment straight line","Both straight lines"],"answer":1,"explain":"Constant w makes V linear in x and M quadratic in x."},{"type":"num","q":"A simply supported beam spans 8 m with a 24 kN point load 2 m from A. What is the maximum bending moment?","answer":36.0,"display":"36","unit":"kN·m","tol":2.0,"explain":"R<sub>A<\/sub> = 24 × 6/8 = 18.0 kN. M<sub>max<\/sub> is under the load: 18.0 × 2 = 36.0 kN·m. Or use Pa(L − a)/L = 24·2·6/8."},{"type":"num","q":"For the same beam, what is the bending moment 5 m from A?","answer":18.0,"display":"18","unit":"kN·m","tol":2.0,"explain":"R<sub>B<\/sub> = 24 − 18.0 = 6.00 kN. Working from the right: M = 6.00 × 3 = 18.0 kN·m."},{"type":"mc","q":"A loaded ship has heavy cargo concentrated amidships, while most of its buoyancy is towards the ends. The hull is:","options":["Hogging, with the deck in tension","Sagging, with the deck in compression","In pure shear","Unstressed"],"answer":1,"explain":"Excess weight amidships bends the hull concave-up. That is sagging, with the deck in compression and the keel in tension."}]},{"n":8,"title":"Dry friction and wedges","chapter":"Ch. 8.1–8.3","readings":[{"sec":"8.1","title":"Characteristics of dry friction","pages":"book pp. 401–405 (PDF pp. 423–427)","depth":"core"},{"sec":"8.2","title":"Problems involving dry friction","pages":"book pp. 406–429 (PDF pp. 428–451)","depth":"core"},{"sec":"8.3","title":"Wedges","pages":"book pp. 430–431 (PDF pp. 452–453)","depth":"core"}],"objectives":["Use F ≤ μsN, and know when friction is at its limit","Relate the angle of friction and angle of repose to μ","Solve block-on-incline problems, pushing up and holding back","Decide whether a body slips or tips first","Calculate the work done against friction moving up a plane"],"notes":[{"h":"The friction law","p":"Friction acts along the contact surface and opposes motion, or the motion that is about to happen. Static friction adjusts to whatever is needed, up to a limit: <b>F ≤ μ<sub>s<\/sub>N<\/b>. At the point of slipping, F = μ<sub>s<\/sub>N. Once sliding, <b>F<sub>k<\/sub> = μ<sub>k<\/sub>N<\/b>, and μ<sub>k<\/sub> is usually about 25% less than μ<sub>s<\/sub>. Friction does not depend on contact area."},{"h":"Angle of friction","p":"The resultant of N and F leans at angle φ from the normal, where <b>tan φ<sub>s<\/sub> = μ<sub>s<\/sub><\/b>. A block on an incline starts to slide when the slope reaches φ<sub>s<\/sub>. This is the <b>angle of repose<\/b>."},{"h":"Inclined plane (exam staple)","p":"Weight W on a slope θ, with the force P parallel to the slope. <b>Push up<\/b> at impending motion or steady speed: P = W(sin θ + μ cos θ). <b>Hold from sliding down<\/b>: P = W(sin θ − μ cos θ). If this comes out negative, the block holds itself. Work done moving distance s up the slope is P·s, and the friction part of it is μW cos θ·s."},{"h":"Slip or tip?","p":"A tall box pushed sideways can slide or tip over. Work out the push needed for each. Slip: P = μ<sub>s<\/sub>W. Tip about the front edge: P·h = W·(b/2). The <b>smaller<\/b> P is what happens first. Then check that N and F are possible: N ≥ 0, and F ≤ μN unless the box is slipping."},{"h":"Wedges","p":"Wedges lift or adjust heavy loads with a small force. Draw an FBD of each piece, with friction on <b>every<\/b> sliding face opposing the motion that is about to happen. A wedge is <b>self-locking<\/b>, so it stays in place when P is removed, if the friction is high enough compared with the wedge angle."}],"formulas":[["Static (limit) / kinetic","F<sub>s<\/sub> = μ<sub>s<\/sub> N,  F<sub>k<\/sub> = μ<sub>k<\/sub> N"],["Angle of friction","tan φ = μ"],["Push up a slope (P ∥ slope)","P = W (sin θ + μ cos θ)"],["Hold on a slope (P ∥ slope)","P = W (sin θ − μ cos θ)"],["Work up a slope","U = P s"],["Tipping (push at height h, base b)","P<sub>tip<\/sub> = W b / (2h)"]],"example":{"title":"Skidding a crate up a ramp","problem":"A 200 kg crate of spares sits on a 20° ramp with μ<sub>s<\/sub> = 0.30 and μ<sub>k<\/sub> = 0.25. (a) Will it stay put on its own? (b) What force, parallel to the ramp, keeps it moving up at steady speed?","steps":["W = 200 × 9.81 = 1 962 N.","(a) Compare the slope with the angle of friction: tan 20° = 0.364, which is more than μ<sub>s<\/sub> = 0.30. The crate <b>slides down<\/b> unless it's held.","(b) Moving up, so kinetic friction acts down the slope: P = W(sin 20° + μ<sub>k<\/sub> cos 20°).","P = 1 962(0.3420 + 0.25 × 0.9397) = <b>1 132 N<\/b>."],"answer":"(a) It slides, because tan 20° > μ<sub>s<\/sub>. (b) P = 1 132 N."},"marine":"Chocks and wedges under machinery, skidding a pump across deck plates, cargo shifting as the ship rolls, and hand-ramping a drum up a gangway are all friction problems. The Applied Mechanics outcome 'work done moving up a plane at uniform speed' is exactly the inclined-plane formula from this week.","practice":[{"set":"Preliminary","items":"P8–1 to P8–4","where":"book p. 415; solutions p. 638"},{"set":"Fundamental","items":"F8–1 to F8–9","where":"book pp. 416–417; solutions p. 620"},{"set":"Review","items":"R8–1, R8–2, R8–3, R8–5","where":"book p. 462; solutions p. 648"}],"test":[{"type":"mc","q":"The friction force on a body at rest:","options":["Always equals μ<sub>s<\/sub>N","Is whatever is needed for equilibrium, up to a maximum of μ<sub>s<\/sub>N","Depends on the contact area","Acts perpendicular to the surface"],"answer":1,"explain":"Static friction only reaches μ<sub>s<\/sub>N when slipping is about to happen."},{"type":"num","q":"Two surfaces have μ<sub>s<\/sub> = 0.4 and are pressed together by a 500 N normal force. What is the maximum static friction force?","answer":200,"display":"200","unit":"N","tol":2.0,"explain":"F = μ<sub>s<\/sub>N = 0.4 × 500 = 200 N."},{"type":"num","q":"A block on a tilting plate starts to slide when the plate reaches 22°. What is μ<sub>s<\/sub>?","answer":0.404026,"display":"0.404","unit":"","tol":2.0,"explain":"μ<sub>s<\/sub> = tan 22° = 0.404."},{"type":"num","q":"A 50 kg crate sits on a level deck with μ<sub>s<\/sub> = 0.35. What horizontal force will just start it moving?","answer":171.675,"display":"172","unit":"N","tol":2.0,"explain":"P = μ<sub>s<\/sub>mg = 0.35 × 50 × 9.81 = 172 N."},{"type":"num","q":"A 100 kg crate is pushed up a 15° incline at steady speed, with μ<sub>k<\/sub> = 0.2 and the force parallel to the incline. What force is needed?","answer":443.41613,"display":"443","unit":"N","tol":2.0,"explain":"P = W(sin 15° + μ cos 15°) = 981(0.2588 + 0.1932) = 443 N."},{"type":"num","q":"How much work is done pushing that crate 5 m up the incline?","answer":2.217081,"display":"2.22","unit":"kJ","tol":2.0,"explain":"U = Ps = 443.4 × 5 = 2 217 J = 2.22 kJ."},{"type":"mc","q":"The angle of repose of a material is:","options":["Always 45°","Equal to the angle of static friction, so tan θ = μ<sub>s<\/sub>","Equal to the angle of kinetic friction","Independent of the material"],"answer":1,"explain":"A heap or a block on a slope stays put up to θ = φ<sub>s<\/sub>."},{"type":"num","q":"What force, parallel to a 30° incline, stops a 100 kg crate sliding down if μ<sub>s<\/sub> = 0.25?","answer":278.10727,"display":"278","unit":"N","tol":2.0,"explain":"P = W(sin 30° − μ cos 30°) = 981(0.5 − 0.2165) = 278 N. Friction helps here by acting up the slope."},{"type":"mc","q":"A tall cabinet is pushed horizontally near its top. It will tip rather than slide if:","options":["The push needed to tip it is less than the push needed to slide it","μ<sub>s<\/sub> is very small","It is very heavy","The floor is level"],"answer":0,"explain":"Whichever condition needs the smaller push happens first."},{"type":"num","q":"A cabinet is 1.2 m tall and 0.6 m wide and weighs 800 N, with μ<sub>s<\/sub> = 0.4. It is pushed horizontally at its top edge. What push starts it moving, either by tipping or by sliding?","answer":200,"display":"200","unit":"N","tol":2.0,"explain":"Tip: P = W(b/2)/h = 800 × 0.3/1.2 = 200 N. Slide: P = 0.4 × 800 = 320 N. Tipping needs less, so it tips at 200 N."}]},{"n":9,"title":"Screws, belts, bearings and rolling resistance","chapter":"Ch. 8.4–8.8","readings":[{"sec":"8.4","title":"Frictional forces on screws","pages":"book pp. 432–438 (PDF pp. 454–460)","depth":"core"},{"sec":"8.5","title":"Frictional forces on flat belts","pages":"book pp. 439–446 (PDF pp. 461–468)","depth":"core"},{"sec":"8.6","title":"Collar bearings, pivot bearings and disks","pages":"book pp. 447–449 (PDF pp. 469–471)","depth":"core"},{"sec":"8.7","title":"Journal bearings","pages":"book pp. 450–451 (PDF pp. 472–473)","depth":"core"},{"sec":"8.8","title":"Rolling resistance","pages":"book pp. 452–461 (PDF pp. 474–483)","depth":"skim"}],"objectives":["Find the torque to raise or lower a load with a square-threaded screw, and check for self-locking","Use the belt and capstan equation T₂ = T₁e^(μβ)","Calculate the power a belt drive transmits","Find the friction torque and power lost in collar and journal bearings","Estimate rolling resistance"],"notes":[{"h":"Square-threaded screws","p":"A screw thread is an incline wrapped around a cylinder. The lead angle is θ = tan⁻¹(l / 2πr), with l the lead and r the mean radius. The torque to <b>raise<\/b> load W is M = W r tan(θ + φ<sub>s<\/sub>), where φ<sub>s<\/sub> = tan⁻¹ μ<sub>s<\/sub>. The screw is <b>self-locking<\/b>, so it holds the load with no torque applied, when φ<sub>s<\/sub> > θ. The torque to lower a self-locking screw is M = W r tan(φ<sub>s<\/sub> − θ)."},{"h":"Belts and ropes on drums","p":"A flat belt or rope wrapped through an angle β (in <b>radians<\/b>) on a drum, just about to slip: <b>T₂ = T₁ e<sup>μβ<\/sup><\/b>. T₂ is the larger tension, on the side being pulled toward the motion. One full turn is 2π rad. Because the relation is exponential, a few turns let one deckhand hold a ship."},{"h":"Belt power","p":"A belt drive transmits power through the <i>difference<\/i> in tension: <b>P = (T₂ − T₁)·v<\/b>, with v the belt speed in m/s. For V-belts the effective μ is larger, because the belt wedges into the groove. This is covered in the exam syllabus, but Hibbeler treats only flat belts."},{"h":"Collar and pivot bearings","p":"A thrust collar or pivot carries an <b>axial<\/b> load P. Assuming uniform pressure, the friction torque is M = (2/3) μ P (R₂³ − R₁³)/(R₂² − R₁²). For a solid disk (R₁ = 0), M = (2/3) μ P R."},{"h":"Journal bearings and power lost","p":"A shaft in a journal bearing carries a <b>radial<\/b> load P. The friction torque is M = P r sin φ<sub>k<\/sub> ≈ <b>μ P r<\/b> when μ is small. The power lost to friction is <b>M·ω<\/b>, with ω = 2πN/60 rad/s. This is a named exam outcome: 'energy and power lost to friction in simple bearings'."},{"h":"Rolling resistance","p":"A wheel on a soft surface needs a push P ≈ W a / r to keep it rolling, where a is the coefficient of rolling resistance (a length) and r is the wheel radius."}],"formulas":[["Screw lead angle","θ = tan⁻¹(l / 2πr)"],["Screw raise / lower","M = W r tan(θ + φ),  M = W r tan(φ − θ)"],["Self-locking","φ<sub>s<\/sub> > θ"],["Belt / capstan","T₂ = T₁ e<sup>μβ<\/sup>  (β in rad)"],["Belt power","P = (T₂ − T₁) v"],["Collar bearing","M = ⅔ μ P (R₂³ − R₁³)/(R₂² − R₁²)"],["Journal bearing","M ≈ μ P r,  Power = M ω = M · 2πN/60"],["Rolling resistance","P ≈ W a / r"]],"example":{"title":"Turns on a bollard","problem":"A ship surges against a mooring line with 20 kN. A deckhand can hold 200 N on the tail. With μ = 0.3 between the rope and the bollard, how many turns are needed?","steps":["T₂ = 20 000 N (load side) and T₁ = 200 N (deckhand). T₂/T₁ = 100.","100 = e<sup>0.3β<\/sup>, so β = ln(100)/0.3.","β = 4.605/0.3 = <b>15.4 rad<\/b>","Turns = β/2π = <b>2.44<\/b>, so take 3 full turns. Each extra turn multiplies the holding power by e<sup>0.3·2π<\/sup> ≈ 6.6."],"answer":"β = 15.4 rad ≈ 2.44 turns, so use 3."},"marine":"This is the most directly 'ship' week. Bollards, capstans and windlass warping ends use the capstan equation. V-belts drive engine-room auxiliaries. Screw jacks and jacking bolts are used for engine alignment. The propeller thrust block is a collar bearing, and line-shaft bearings are journal bearings. Belt power and bearing power loss are both listed Applied Mechanics outcomes.","practice":[{"set":"Screws","items":"8–71, 8–72, 8–77","where":"book pp. 437–438; answers p. 658"},{"set":"Belts","items":"8–83, 8–84, 8–89, 8–91","where":"book pp. 442–443; answers p. 658"},{"set":"Bearings","items":"8–107, 8–108, 8–116, 8–117, 8–120","where":"book pp. 454–456; answers p. 658"},{"set":"Review","items":"R8–4, R8–6, R8–8","where":"book p. 462; solutions p. 648"}],"test":[{"type":"num","q":"A rope is held stationary over a fixed drum with 180° of wrap and μ = 0.25. The holding side has 500 N. What is the largest load the other side can carry without slipping?","answer":1096.640025,"display":"1 097","unit":"N","tol":2.0,"explain":"T₂ = 500 e<sup>0.25π<\/sup> = 500 × 2.193 = 1 097 N."},{"type":"num","q":"A 15 kN load is to be held on a bollard with 150 N, with μ = 0.3. How many turns of rope are needed? Give the exact, non-whole number.","answer":2.443119,"display":"2.44","unit":"turns","tol":3,"explain":"β = ln(15000/150)/0.3 = 15.4 rad. Turns = β/2π = 2.44. In practice you'd take 3."},{"type":"num","q":"A belt drive has a tight-side tension of 900 N, μ = 0.3 and 160° of wrap on the smaller pulley. What is the least slack-side tension before slip?","answer":389.411538,"display":"389","unit":"N","tol":2.0,"explain":"β = 160° = 2.793 rad. T₁ = 900 / e<sup>0.3 × 2.793<\/sup> = 389 N."},{"type":"num","q":"If that belt runs at 10 m/s, what power does it transmit?","answer":5.105885,"display":"5.11","unit":"kW","tol":2.0,"explain":"P = (T₂ − T₁)v = (510.6) × 10 = 5 106 W = 5.11 kW."},{"type":"num","q":"A square-threaded screw jack has a mean diameter of 40 mm, a lead of 8 mm and μ<sub>s<\/sub> = 0.15. What torque raises a 20 kN load?","answer":86.288788,"display":"86.3","unit":"N·m","tol":2.0,"explain":"θ = tan⁻¹(8/(π·40)) = 3.64°. φ = tan⁻¹ 0.15 = 8.53°. M = 20 000 × 0.020 × tan(12.2°) = 86.3 N·m."},{"type":"mc","q":"A square-threaded screw is self-locking when:","options":["The lead angle θ is greater than the friction angle φ<sub>s<\/sub>","The friction angle φ<sub>s<\/sub> is greater than the lead angle θ","μ = 0","The lead equals the pitch"],"answer":1,"explain":"If φ<sub>s<\/sub> > θ, friction alone holds the load. In Q5 φ = 8.53° is greater than θ = 3.64°, so that jack is self-locking."},{"type":"num","q":"A 100 mm diameter shaft runs at 300 rev/min in a journal bearing with a radial load of 30 kN and μ = 0.05. What power is lost to friction?","answer":2.356194,"display":"2.36","unit":"kW","tol":2.0,"explain":"M ≈ μPr = 0.05 × 30 000 × 0.05 = 75.0 N·m. ω = 2π × 300/60 = 31.42 rad/s. Power = Mω = 2 356 W = 2.36 kW."},{"type":"num","q":"A thrust collar has inner radius 50 mm and outer radius 100 mm. It carries an axial load of 10 kN with μ = 0.08. What is the friction torque, assuming uniform pressure?","answer":62.222222,"display":"62.2","unit":"N·m","tol":2.0,"explain":"M = ⅔ × 0.08 × 10 000 × (0.1³ − 0.05³)/(0.1² − 0.05²) = 62.2 N·m."},{"type":"num","q":"A 2000 kg machine is moved on rollers with radius 0.15 m. The coefficient of rolling resistance is a = 0.5 mm. What horizontal force keeps it rolling?","answer":65.4,"display":"65.4","unit":"N","tol":2.0,"explain":"P ≈ Wa/r = (2000 × 9.81)(0.0005)/0.15 = 65.4 N."},{"type":"mc","q":"In the belt friction equation T₂ = T₁e<sup>μβ<\/sup>:","options":["β is in degrees and T₂ < T₁","β is in radians and T₂ is the larger tension","β is in turns","It only applies to V-belts"],"answer":1,"explain":"β must be in radians, and T₂ is on the side being pulled toward the slip."}]},{"n":10,"title":"Centre of gravity, centroids and fluid pressure","chapter":"Ch. 9","readings":[{"sec":"9.1","title":"Centre of gravity, centre of mass, centroid","pages":"book pp. 465–487 (PDF pp. 487–509)","depth":"skim"},{"sec":"9.2","title":"Composite bodies","pages":"book pp. 488–501 (PDF pp. 510–523)","depth":"core"},{"sec":"9.3","title":"Theorems of Pappus and Guldinus","pages":"book pp. 502–510 (PDF pp. 524–532)","depth":"skim"},{"sec":"9.4–9.5","title":"General distributed loads, fluid pressure","pages":"book pp. 511–528 (PDF pp. 533–550)","depth":"core"}],"objectives":["Find the centroid of composite areas, including holes","Find the centre of gravity of a set of weights, including a ship's KG","Use Pappus to get areas and volumes of revolution","Calculate hydrostatic pressure and the force on submerged plane surfaces","Locate the centre of pressure"],"notes":[{"h":"Centroid and centre of gravity","p":"The <b>centre of gravity<\/b> G is the point where the total weight acts. The <b>centroid<\/b> C is the geometric centre of a shape. The two coincide for a uniform material. You can
