find them by integration (section 9.1), but in practice you build shapes from standard pieces."},{"h":"Composite method","p":"Break the shape into simple parts. Tabulate each part's area A and centroid position x̃, ỹ. Then <b>x̄ = Σx̃A / ΣA<\/b> and <b>ȳ = ΣỹA / ΣA<\/b>. A hole is a <b>negative area<\/b>. Standard centroids: rectangle at the middle; triangle at h/3 from the base; semicircle at 4r/3π from the diameter; quarter circle at 4r/3π from each straight edge."},{"h":"A ship's KG","p":"The vertical centre of gravity of a loaded ship works the same way with weights: <b>KG = Σ(w × Kg) / Σw<\/b>. Kg is each item's height above the keel. Loading weight low pulls KG down. Discharging from low down pushes KG up."},{"h":"Pappus–Guldinus","p":"Spin a line or area about an axis. Surface area = θ r̄ L and volume = θ r̄ A, where r̄ is the distance from the axis to the centroid of the line or area, and θ = 2π for a full turn. This is quick for rings, gaskets and V-belt pulleys."},{"h":"Fluid pressure","p":"Pressure at depth h is <b>p = ρgh<\/b>. It acts perpendicular to any surface. Use ρ = 1000 kg/m³ for fresh water and 1025 kg/m³ for seawater."},{"h":"Force on a submerged plane","p":"Resultant <b>F = ρg h̄ A<\/b>, where h̄ is the depth of the plate's <i>centroid<\/i>. It acts at the <b>centre of pressure<\/b>, which is always below the centroid: h<sub>cp<\/sub> = h̄ + I<sub>G<\/sub> /(h̄A). For a vertical rectangle whose top edge is at the surface, the centre of pressure is at <b>⅔ of the depth<\/b>, from the triangular load in week 4."}],"formulas":[["Composite centroid","x̄ = Σx̃A / ΣA,  ȳ = ΣỹA / ΣA"],["Ship's KG","KG = Σ(w·Kg) / Σw"],["Triangle / semicircle","h/3 from base,  4r / 3π from diameter"],["Pappus","A = θ r̄ L,  V = θ r̄ A"],["Hydrostatic pressure","p = ρ g h"],["Force on plane surface","F = ρ g h̄ A"],["Centre of pressure","h<sub>cp<\/sub> = h̄ + I<sub>G<\/sub> / (h̄ A)  (rectangle: I<sub>G<\/sub> = bd³/12)"]],"example":{"title":"Load on a tank-end bulkhead","problem":"A fresh-water tank has a vertical end bulkhead 3 m wide, and the water is 2 m deep. Find the resultant force on the bulkhead and how far below the surface it acts.","steps":["Wetted area A = 3 × 2 = 6 m². Centroid depth h̄ = 1 m.","F = ρg h̄ A = 1000 × 9.81 × 1 × 6 = <b>58.9 kN<\/b>.","Centre of pressure: I<sub>G<\/sub> = 3 × 2³/12 = 2 m⁴, so h<sub>cp<\/sub> = 1 + 2/(1 × 6) = <b>1.333 m<\/b> below the surface.","Check: the pressure diagram is a triangle, and its resultant acts at ⅔ × 2 = 1.333 m ✓"],"answer":"F = 58.9 kN, acting 1.333 m below the surface (0.667 m above the tank bottom)."},"marine":"Centre of gravity and hydrostatic force on immersed plane surfaces are both named Applied Mechanics outcomes. On board, the same maths gives the ship's KG in the stability book, loads on tank boundaries and sea-chest covers, the force on a watertight door, and the head a pump has to work against.","practice":[{"set":"Preliminary","items":"P9–1","where":"book p. 479; solutions p. 638"},{"set":"Fundamental","items":"F9–7 to F9–12 (composite), F9–13 to F9–16 (Pappus), F9–17 to F9–21 (fluids)","where":"book pp. 493, 506, 519; solutions p. 620"},{"set":"Review","items":"R9–1, R9–2, R9–5, R9–8 to R9–10","where":"book p. 526; solutions p. 648"}],"test":[{"type":"num","q":"A T-section is made of a web 20 mm wide by 180 mm tall (from y = 0 to 180 mm) with a flange 200 mm wide by 20 mm thick on top (y = 180 to 200 mm). Find the height ȳ of its centroid above the bottom.","answer":142.631579,"display":"143","unit":"mm","tol":2.0,"explain":"Web: A = 3600 mm², ỹ = 90. Flange: A = 4000 mm², ỹ = 190. ȳ = (3600·90 + 4000·190)/7600 = 143 mm."},{"type":"num","q":"A 300 mm × 200 mm plate has a 100 mm diameter hole centred 200 mm from its left edge. Find x̄ of the plate, measured from the left edge.","answer":142.469241,"display":"142","unit":"mm","tol":2.0,"explain":"Plate: 60 000 mm² at 150. Hole: −7 854 mm² at 200. x̄ = (60 000·150 − 7 854·200)/(60 000 − 7 854) = 142 mm. The hole shifts the centroid away from itself."},{"type":"mc","q":"The centroid of a triangle lies:","options":["At mid-height","One third of the height up from the base","Two thirds of the height up from the base","At the apex"],"answer":1,"explain":"Triangle: h/3 from the base, which is 2h/3 from the apex."},{"type":"num","q":"A ship's lightship is 2000 t with KG 6.0 m. It loads 500 t of fuel at Kg 2.0 m and 300 t of cargo at Kg 8.0 m. What is the new KG?","answer":5.5,"display":"5.5","unit":"m","tol":2.0,"explain":"KG = (2000·6 + 500·2 + 300·8)/2800 = 15 400/2800 = 5.50 m."},{"type":"num","q":"What is the gauge pressure 6 m below the surface of seawater (ρ = 1025 kg/m³)?","answer":60.3315,"display":"60.3","unit":"kPa","tol":2.0,"explain":"p = ρgh = 1025 × 9.81 × 6 = 60 332 Pa = 60.3 kPa."},{"type":"num","q":"A vertical door 1 m wide and 2 m high has its top edge at the surface of fresh water. What is the resultant water force on it?","answer":19.62,"display":"19.6","unit":"kN","tol":2.0,"explain":"F = ρg h̄ A = 1000 × 9.81 × 1 × 2 = 19.6 kN."},{"type":"num","q":"How far below the surface is the centre of pressure on that door?","answer":1.333333,"display":"1.33","unit":"m","tol":2.0,"explain":"For a rectangle that reaches the surface, h<sub>cp<\/sub> = ⅔ × 2 = 1.333 m."},{"type":"num","q":"A vertical hatch 1.2 m wide and 0.8 m high has its top edge 3 m below the surface of seawater. What is the resultant force on it?","answer":32.820336,"display":"32.8","unit":"kN","tol":2.0,"explain":"h̄ = 3 + 0.4 = 3.4 m. A = 0.96 m². F = 1025 × 9.81 × 3.4 × 0.96 = 32.8 kN."},{"type":"num","q":"A ring has a circular cross-section of radius 20 mm, and its centroid is 200 mm from the axis. What is its volume (Pappus)?","answer":1.579137,"display":"1.58","unit":"litres","tol":2.0,"explain":"V = 2π r̄ A = 2π(0.2)(π × 0.02²) = 0.001579 m³ = 1.58 L."},{"type":"mc","q":"On a vertical submerged plane surface, the centre of pressure is:","options":["At the centroid","Always below the centroid","Always above the centroid","At the free surface"],"answer":1,"explain":"Pressure increases with depth, so the resultant acts below the centroid. The gap is I<sub>G<\/sub>/(h̄A)."}]},{"n":11,"title":"Moments of inertia and stability","chapter":"Ch. 10 & 11","readings":[{"sec":"10.1–10.3","title":"Area moment of inertia, parallel-axis theorem, radius of gyration","pages":"book pp. 529–539 (PDF pp. 551–561)","depth":"core"},{"sec":"10.4","title":"Composite areas","pages":"book pp. 540–547 (PDF pp. 562–569)","depth":"core"},{"sec":"10.8","title":"Mass moment of inertia","pages":"book pp. 563–580 (PDF pp. 585–602)","depth":"core"},{"sec":"10.5–10.7","title":"Product of inertia, inclined axes, Mohr's circle","pages":"book pp. 548–562 (PDF pp. 570–584)","depth":"skip"},{"sec":"11.1–11.3","title":"Virtual work","pages":"book pp. 581–596 (PDF pp. 603–618)","depth":"skim"},{"sec":"11.4–11.7","title":"Potential energy and stability of equilibrium","pages":"book pp. 597–615 (PDF pp. 619–637)","depth":"core"}],"objectives":["Calculate I for rectangles and circles, and the polar moment J for shafts","Use the parallel-axis theorem for composite sections","Find the radius of gyration","Calculate mass moments of inertia for discs, flywheels and rods","Judge whether an equilibrium is stable, neutral or unstable"],"notes":[{"h":"Why I matters","p":"The area moment of inertia I measures how well a cross-section resists bending. Bending stress is σ = My/I and torsional shear is τ = Tr/J. Those formulas come in the 'beams' and 'torsion' parts of Applied Mechanics, which are outside this book. You need I and J ready for them."},{"h":"Standard results","p":"Rectangle, width b and depth h, about its own centroid: <b>Ī = bh³/12<\/b>. About its base: bh³/3. Solid circle: I = πd⁴/64, and the polar moment is <b>J = πd⁴/32<\/b>. Hollow shaft: J = π(D⁴ − d⁴)/32. Notice the depth is <b>cubed<\/b>: doubling the depth makes a beam 8 times stiffer."},{"h":"Parallel-axis theorem","p":"<b>I = Ī + A d²<\/b>, where d is the distance from the shape's own centroid to the new axis. The centroidal value is always the <b>smallest<\/b>. For a composite section: (1) find the overall centroid (week 10), (2) add Ī + Ad² for each part, (3) subtract the holes."},{"h":"Radius of gyration","p":"<b>k = √(I/A)<\/b>. This is the distance at which all the area could be concentrated and still give the same I. Column (strut) formulas use it. For mass, k = √(I/m)."},{"h":"Mass moment of inertia","p":"I = ∫r² dm measures resistance to <i>angular acceleration<\/i>. It's the rotational version of mass. Solid disc or flywheel: <b>½mr²<\/b>. Thin ring: mr². Slender rod about its centre: mL²/12, and about one end: mL²/3. Parallel axis: I = I<sub>G<\/sub> + md². You'll need these for flywheels, propellers and rotors in dynamics."},{"h":"Stability of equilibrium","p":"With potential energy V (gravity plus springs) as a function of position θ, equilibrium is where <b>dV/dθ = 0<\/b>. If d²V/dθ² > 0 (V at a minimum), the equilibrium is <b>stable<\/b>: nudge it and it returns. If d²V/dθ² < 0 it is <b>unstable<\/b>, and if V is constant it is <b>neutral<\/b>. A pendulum hanging down is stable. A ship is stable when its centre of gravity G is below its metacentre M, so the metacentric height GM is positive. Raising KG (week 10) reduces GM."}],"formulas":[["Rectangle","Ī = bh³/12,  I<sub>base<\/sub> = bh³/3"],["Circle / polar","I = πd⁴/64,  J = πd⁴/32"],["Hollow shaft","J = π(D⁴ − d⁴)/32"],["Parallel axis","I = Ī + A d²   (mass: I = I<sub>G<\/sub> + m d²)"],["Radius of gyration","k = √(I/A)  or  √(I/m)"],["Disc / ring / rod","½mr²,  mr²,  mL²/12 (centre), mL²/3 (end)"],["Stability","dV/dθ = 0;  d²V/dθ² > 0 stable"]],"example":{"title":"Bending stiffness of a T-bar stiffener","problem":"Use the T-section from week 10 (web 20 × 180 mm, flange 200 × 20 mm on top). Find I about the horizontal axis through its centroid.","steps":["From week 10: ȳ = 142.6 mm above the bottom.","Web: Ī = 20 × 180³/12 = 9.72 × 10⁶ mm⁴. d = 142.6 − 90 = 52.63 mm. Ad² = 3600 × 52.63² = 9.97 × 10⁶ mm⁴.","Flange: Ī = 200 × 20³/12 = 0.133 × 10⁶ mm⁴. d = 190 − 142.6 = 47.37 mm. Ad² = 4000 × 47.37² = 8.98 × 10⁶ mm⁴.","Total: I = 9.72 + 9.97 + 0.133 + 8.98 = <b>28.8 × 10⁶ mm⁴<\/b>."],"answer":"I = 28.8 × 10⁶ mm⁴ about the centroidal axis."},"marine":"I and J feed straight into beam bending and shaft torsion: line-shaft sizing, coupling bolts and stiffener strength are all on the Applied Mechanics syllabus. Mass moment of inertia governs flywheels and turning gear. The stability section is the statics behind GM and the ship's stability book.","practice":[{"set":"Fundamental","items":"F10–1 to F10–8","where":"book pp. 536 & 543; solutions p. 620"},{"set":"Fundamental","items":"F11–1 to F11–3 (optional)","where":"book p. 591; solutions p. 620"},{"set":"Review","items":"R10–1 to R10–4, R10–8","where":"book p. 578; solutions p. 648"}],"test":[{"type":"num","q":"A rectangle is 100 mm wide and 200 mm deep. Find its I about the horizontal axis through its centroid, in units of 10⁶ mm⁴.","answer":66.666667,"display":"66.7","unit":"× 10⁶ mm⁴","tol":2.0,"explain":"Ī = bh³/12 = 100 × 200³/12 = 66.7 × 10⁶ mm⁴."},{"type":"num","q":"For the same rectangle, find I about its base, in units of 10⁶ mm⁴.","answer":266.666667,"display":"267","unit":"× 10⁶ mm⁴","tol":2.0,"explain":"I = bh³/3 = 267 × 10⁶ mm⁴. Check: Ī + Ad² = 66.67 + 20 000 × 100² / 10⁶ = 266.7 ✓"},{"type":"num","q":"Find the polar moment of inertia J of an 80 mm diameter solid shaft, in units of 10⁶ mm⁴.","answer":4.021239,"display":"4.02","unit":"× 10⁶ mm⁴","tol":2.0,"explain":"J = πd⁴/32 = π × 80⁴/32 = 4.02 × 10⁶ mm⁴."},{"type":"num","q":"An area of 5000 mm² has Ī = 2 × 10⁶ mm⁴ about its centroidal axis. Find I about a parallel axis 40 mm away, in units of 10⁶ mm⁴.","answer":10,"display":"10","unit":"× 10⁶ mm⁴","tol":2.0,"explain":"I = Ī + Ad² = 2 × 10⁶ + 5000 × 40² = 10 × 10⁶ mm⁴."},{"type":"num","q":"What is the radius of gyration of that area about the 40 mm axis?","answer":44.72136,"display":"44.7","unit":"mm","tol":2.0,"explain":"k = √(I/A) = √(10 × 10⁶/5000) = 44.7 mm."},{"type":"num","q":"A solid flywheel disc has a mass of 400 kg and a diameter of 1.2 m. What is its mass moment of inertia about the shaft?","answer":72.0,"display":"72","unit":"kg·m²","tol":2.0,"explain":"I = ½mr² = ½ × 400 × 0.6² = 72 kg·m²."},{"type":"num","q":"A slender rod 3 m long with a mass of 12 kg swings about one end. What is its mass moment of inertia about that end?","answer":36.0,"display":"36","unit":"kg·m²","tol":2.0,"explain":"I = mL²/3 = 12 × 9/3 = 36 kg·m². Or I<sub>G<\/sub> + md² = 12·9/12 + 12·1.5² = 9 + 27 = 36 ✓"},{"type":"mc","q":"Of all the parallel axes, the area moment of inertia is smallest about:","options":["The base","The axis through the centroid","Any axis, since they're all equal","The axis furthest away"],"answer":1,"explain":"I = Ī + Ad² is smallest when d = 0."},{"type":"mc","q":"An equilibrium position is stable when the potential energy V is:","options":["A maximum, d²V/dθ² < 0","A minimum, d²V/dθ² > 0","Zero","Constant"],"answer":1,"explain":"At a minimum of V, any small displacement raises V, and the body returns."},{"type":"mc","q":"I-beams and channel stiffeners are efficient in bending because:","options":["They are light","Most of their material is far from the neutral axis, which gives a large I for their area","They have a small I","They are symmetric"],"answer":1,"explain":"The Ad² terms dominate, so putting the area in the flanges is efficient."}]},{"n":12,"title":"Review and final exam","chapter":"All chapters","readings":[{"sec":"Review","title":"Re-read your formula sheet and every 'Important Points' box","pages":"All chapters","depth":"core"},{"sec":"Ch. 2–10","title":"Chapter Review summaries at the end of each chapter","pages":"End of each chapter","depth":"core"}],"objectives":["Pull the whole course together under exam conditions","Find your weak topics from the weekly test scores and fix them","Sit a 20-question final in 90 minutes and aim for 70% or more"],"notes":[{"h":"How to use this week","p":"Sessions 1–2: go through the hub's progress page and redo every weekly-test question you got wrong, without looking at the explanation first. Session 3: work two Review problems from each of chapters 5, 7, 8 and 9 under time pressure. Session 4: sit the final exam in one go, closed book, with a calculator and your formula sheet only."},{"h":"Exam technique","p":"Draw a free-body diagram for <i>every<\/i> question, even the 'easy' ones. Write the equation before the numbers. Keep units on every line. Round only at the end, to 3 significant figures. If an answer looks odd (a 5 kg pump needing 9 kN to move), go back to the FBD first."},{"h":"What this book doesn't cover","p":"The Applied Mechanics exams also include <b>dynamics<\/b> (linear and angular motion, work, energy and power, which is Hibbeler's Dynamics, chapters 12–22), <b>strength of materials<\/b> (stress and strain, beams, torsion, thin cylinders), <b>lifting machines<\/b> (mechanical advantage, velocity ratio, efficiency) and <b>hydraulics<\/b> (flow through pipes and orifices). Finishing this plan gives you the statics foundation every one of those topics stands on. A follow-on plan for dynamics is the natural next step."}],"formulas":[],"example":null,"marine":"The final mixes every week's topics in the style of the Applied Mechanics papers. You'll see concurrent forces, beams, friction on planes and in bearings, belts, centre of gravity and hydrostatic force. Treat it as a mock exam.","practice":[{"set":"Review (timed)","items":"R5–1, R5–2, R7–3, R7–4, R8–3, R8–6, R9–8, R9–9","where":"solutions p. 648"}],"test":[{"type":"num","q":"Two forces of 60 kN and 80 kN act at a point at 90° to each other. What is the magnitude of their resultant?","answer":100,"display":"100","unit":"kN","tol":2.0,"explain":"R = √(60² + 80²) = 100 kN."},{"type":"mc","q":"For the forces in Q1, the equilibrant:","options":["Is 140 kN","Is 100 kN, acting opposite to the resultant","Is 20 kN","Bisects the angle between them"],"answer":1,"explain":"The equilibrant is equal and opposite to the resultant."},{"type":"num","q":"A 2000 kg load hangs from two sling legs, each 45° from the vertical. What is the tension in each leg?","answer":13.873435,"display":"13.9","unit":"kN","tol":2.0,"explain":"T = W/(2 cos 45°) = 19.62/(1.414) = 13.9 kN."},{"type":"num","q":"A 300 N force is applied perpendicular to a 0.6 m bar. What moment does it produce about the bar's pivot?","answer":180,"display":"180","unit":"N·m","tol":2.0,"explain":"M = 300 × 0.6 = 180 N·m."},{"type":"num","q":"A force F = (400 <b>i<\/b> + 300 <b>j<\/b>) N acts at the point (2, −1) m. What is its moment about the origin? Give a signed answer with anticlockwise positive.","answer":1000,"display":"1 000","unit":"N·m","tol":2.0,"explain":"M = xF<sub>y<\/sub> − yF<sub>x<\/sub> = 2(300) − (−1)(400) = 1000 N·m, anticlockwise."},{"type":"num","q":"A simply supported beam spans 10 m. It carries a uniform load of 2 kN/m along its full length and a 30 kN point load 4 m from A. What is the reaction at B?","answer":22.0,"display":"22","unit":"kN","tol":2.0,"explain":"ΣM<sub>A<\/sub>: 10R<sub>B<\/sub> = 20(5) + 30(4) = 220, so R<sub>B<\/sub> = 22.0 kN."},{"type":"num","q":"For the same beam, what is the reaction at A?","answer":28.0,"display":"28","unit":"kN","tol":2.0,"explain":"R<sub>A<\/sub> = 20 + 30 − 22.0 = 28.0 kN."},{"type":"num","q":"A 3 m cantilever carries a 5 kN load at the free end and a uniform load of 2 kN/m along its length. What is the magnitude of the moment at the wall?","answer":24,"display":"24","unit":"kN·m","tol":2.0,"explain":"M = 5 × 3 + 2 × 3 × 1.5 = 15 + 9 = 24 kN·m."},{"type":"num","q":"A triangular truss spans 6 m. Its apex is 2 m high and carries 9 kN. What is the magnitude of the force in one sloping member?","answer":8.11249,"display":"8.11","unit":"kN","tol":2.0,"explain":"Reactions are 4.5 kN each. The member is √(3² + 2²) = 3.606 m long. F = 4.5 × 3.606/2 = 8.11 kN (C)."},{"type":"num","q":"A simply supported beam spans 6 m. A uniform load of 4 kN/m covers only the left 3 m. What is the maximum bending moment?","answer":10.125,"display":"10.1","unit":"kN·m","tol":2.0,"explain":"R<sub>B<\/sub> = 12 × 1.5/6 = 3 kN, so R<sub>A<\/sub> = 9 kN. V = 9 − 4x = 0 at x = 2.25 m. M<sub>max<\/sub> = 9(2.25) − 2(2.25²) = 10.1 kN·m."},{"type":"num","q":"A 300 kg machine sits on a level deck with μ<sub>s<\/sub> = 0.3. What horizontal force will just start it sliding?","answer":882.9,"display":"883","unit":"N","tol":2.0,"explain":"F = 0.3 × 300 × 9.81 = 883 N."},{"type":"num","q":"A 500 kg load is hauled up a 10° slope at 0.5 m/s with μ<sub>k<\/sub> = 0.15 and the pull parallel to the slope. What power is needed?","answer":788.158308,"display":"788","unit":"W","tol":2.0,"explain":"P<sub>force<\/sub> = 4905(sin 10° + 0.15 cos 10°) = 1 576 N. Power = Fv = 1 576 × 0.5 = 788 W."},{"type":"num","q":"A rope makes 3 full turns on a bollard with μ = 0.25 and holds a 25 kN load. What force must be applied on the tail end?","answer":224.582276,"display":"225","unit":"N","tol":2.0,"explain":"β = 3 × 2π = 18.85 rad. T₁ = 25 000 / e<sup>0.25 × 18.85<\/sup> = 225 N."},{"type":"mc","q":"A screw jack will hold its load without a brake when:","options":["Its lead angle exceeds the friction angle","Its friction angle exceeds the lead angle","It is lubricated","Its pitch is large"],"answer":1,"explain":"Self-locking needs φ<sub>s<\/sub> > θ."},{"type":"num","q":"A 150 mm diameter shaft carries a radial load of 40 kN in a journal bearing with μ = 0.04, at 200 rev/min. What power is lost to friction?","answer":2.513274,"display":"2.51","unit":"kW","tol":2.0,"explain":"M = 0.04 × 40 000 × 0.075 = 120 N·m. ω = 20.94 rad/s. P = 2 513 W = 2.51 kW."},{"type":"num","q":"An L-shaped area is made of a 100 × 20 mm horizontal leg (x = 0–100, y = 0–20) and a 20 × 80 mm vertical leg (x = 0–20, y = 20–100). What is x̄?","answer":32.222222,"display":"32.2","unit":"mm","tol":2.0,"explain":"x̄ = (2000 × 50 + 1600 × 10)/3600 = 32.2 mm."},{"type":"num","q":"A ship of 5000 t has KG 7.0 m. It discharges 400 t of cargo from Kg 3.0 m. What is the new KG?","answer":7.347826,"display":"7.35","unit":"m","tol":2.0,"explain":"KG = (5000 × 7 − 400 × 3)/4600 = 7.35 m. Taking weight off low down raises G."},{"type":"num","q":"A vertical bulkhead 4 m wide has seawater 3 m deep against it. What is the resultant force?","answer":180.9945,"display":"181","unit":"kN","tol":2.0,"explain":"F = 1025 × 9.81 × 1.5 × 12 = 181 kN, acting 2 m below the surface."},{"type":"num","q":"Find the polar moment of inertia J of a hollow shaft with outside diameter 100 mm and bore 60 mm, in units of 10⁶ mm⁴.","answer":8.545132,"display":"8.55","unit":"× 10⁶ mm⁴","tol":2.0,"explain":"J = π(100⁴ − 60⁴)/32 = 8.55 × 10⁶ mm⁴."},{"type":"mc","q":"Loading heavy cargo high on deck will:","options":["Lower G and increase GM","Raise G and reduce GM, so the ship is less stable","Have no effect on stability","Move the metacentre down to G"],"answer":1,"explain":"Raising KG reduces GM = KM − KG, which reduces initial stability."}]}]}</script>
<script>
(function(){
const C = JSON.parse(document.getElementById('course-data').textContent);
const W = C.weeks;
const PASS = 70;
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- state & persistence ---------- */
const LS_KEY='statics12-progress';
let S = {start:'', sessions:{}, practice:{}, tests:{}, drafts:{}};
function lsGet(){try{const v=localStorage.getItem(LS_KEY);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
let dbRef=null, syncMsg='Saved on this device';
const l=lsGet(); if(l) S=Object.assign(S,l);
let saveTimer=null, saving=false, pending=false;
function save(){
  lsSet();
  if(window.S12onSave) try{window.S12onSave()}catch(e){}
  if(!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,900);
}
async function flush(){
  if(!dbRef) return;
  if(saving){pending=true;return}
  saving=true;
  try{ await dbRef.set({state:JSON.stringify(S), updated:new Date().toISOString()}); setSync('Synced to your account'); }
  catch(e){ setSync('Saved on this device only'); }
  saving=false;
  if(pending){pending=false;flush()}
}
function setSync(m){syncMsg=m;const el=$('#sync');if(el)el.textContent=m}
/* merge two progress states: keep the best of both */
function mergeState(a,b){
  a=a||{}; b=b||{};
  const out={start:a.start||b.start||'',sessions:{},practice:{},tests:{},drafts:Object.assign({},b.drafts||{},a.drafts||{})};
  for(const k of ['sessions','practice']){
    const keys=new Set([...Object.keys(a[k]||{}),...Object.keys(b[k]||{})]);
    keys.forEach(w=>{const x=(a[k]||{})[w]||[],y=(b[k]||{})[w]||[];const n=Math.max(x.length,y.length);out[k][w]=Array.from({length:n},(_,i)=>!!(x[i]||y[i]))});
  }
  const tk=new Set([...Object.keys(a.tests||{}),...Object.keys(b.tests||{})]);
  tk.forEach(w=>{const x=(a.tests||{})[w],y=(b.tests||{})[w];
    if(!x||!y){out.tests[w]=Object.assign({},x||y);return}
    const newer=(x.date||'')>=(y.date||'')?x:y;
    out.tests[w]={best:Math.max(x.best||0,y.best||0),attempts:Math.max(x.attempts||0,y.attempts||0),last:newer.last,date:newer.date};});
  return out;
}
window.S12={get:()=>S,set:v=>{S=Object.assign({start:'',sessions:{},practice:{},tests:{},drafts:{}},v);lsSet();render()},merge:mergeState,setSync,rerender:()=>render()};
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.doc('data/users/'+id+'/progress');
    const snap=await dbRef.get();
    if(snap.exists){
      const remote=JSON.parse(snap.data().state||'{}');
      S=Object.assign({start:'',sessions:{},practice:{},tests:{},drafts:{}},remote);
      lsSet(); render();
    } else { flush(); }
    setSync('Synced to your account');
  }catch(e){ dbRef=null; }
})();

/* ---------- helpers ---------- */
const test=w=>S.tests['w'+w]||null;
const passed=w=>{const t=test(w);return t&&t.best>=PASS};
function currentWeek(){for(const w of W){if(!passed(w.n))return w.n}return 12}
function weekDates(n){
  if(!S.start) return '';
  const d=new Date(S.start+'T12:00:00'); if(isNaN(d)) return '';
  const a=new Date(d); a.setDate(a.getDate()+(n-1)*7);
  const b=new Date(a); b.setDate(b.getDate()+6);
  const f=x=>x.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  return f(a)+' – '+f(b);
}
function sessionsFor(w){
  const core=w.readings.filter(r=>r.depth==='core').map(r=>r.sec).join(', ');
  const skim=w.readings.filter(r=>r.depth==='skim').map(r=>r.sec).join(', ');
  const prac=w.practice.map(p=>p.items).join('; ');
  if(w.n===12) return [
    ['90 min','Fix weak spots','Redo every weekly-test question you missed (scores are on the home page), without looking at the explanation first.'],
    ['90 min','Formula sheet','Rewrite the full formula sheet from memory, then check it against the Formulas page.'],
    ['60 min','Timed review problems',prac],
    ['90 min','Final exam','20 questions in one sitting, closed book, calculator and formula sheet only. Aim for 70% or more.']];
  return [
    ['90 min','Read','Core: §'+core+'.'+(skim?' Skim: §'+skim+'.':'')+' Copy each formula onto your cheat card as you meet it.'],
    ['90 min','Notes + worked example','Go through the Notes tab, then try the worked example yourself before revealing each step.'],
    ['60 min','Book problems',prac+'. Check every answer in the back of the book.'],
    ['60 min','Weekly test','10 questions, about 40 minutes, closed book. Pass mark '+PASS+'%. Read every explanation, including the ones you got right.']];
}

/* ---------- week ---------- */
let tab='plan';
function weekView(n){
  const w=W[n-1];
  const tabs=[['plan','Plan'],['notes','Notes'],['example','Example'],['practice','Book problems'],['test',n===12?'Final exam':'Test']].filter(t=>!(t[0]==='example'&&!w.example));
  if(!tabs.find(t=>t[0]===tab)) tab='plan';
  const t=test(n);
  return `
  <section class="whead">
    <div class="label">Week ${n} · ${esc(w.chapter)}${S.start?' · '+weekDates(n):''}</div>
    <h1>${esc(w.title)}</h1>
    <div class="chips">${passed(n)?'<span class="chip ok">Passed · best '+t.best+'%</span>':t?'<span class="chip go">Best so far '+t.best+'%</span>':'<span class="chip">Not tested yet</span>'}</div>
  </section>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join('')}</div>
  <div id="pane">${pane(w)}</div>
  <div class="pager">${n>1?`<a class="btn ghost" href="#w${n-1}">← Week ${n-1}</a>`:'<span></span>'}${n<12?`<a class="btn ghost" href="#w${n+1}">Week ${n+1} →</a>`:''}</div>`;
}
function pane(w){
  const n=w.n, key='w'+n;
  if(tab==='plan'){
    const ss=sessionsFor(w); const done=S.sessions[key]||[];
    return `<div class="stack">
      <div class="panel"><div class="label">By the end of this week you can</div><ul class="obj">${w.objectives.map(o=>`<li>${o}</li>`).join('')}</ul></div>
      <div class="panel"><div class="label" style="margin-bottom:6px">Reading</div><div class="tablewrap"><table><thead><tr><th>§</th><th>Topic</th><th>Pages</th><th></th></tr></thead><tbody>
      ${w.readings.map(r=>`<tr><td class="mono">${esc(r.sec)}</td><td>${esc(r.title)}</td><td class="mono">${esc(r.pages)}</td><td><span class="chip ${r.depth==='core'?'core':''}">${r.depth}</span></td></tr>`).join('')}

/* ---------- test ---------- */
let marked={};
function parseNum(s){
  if(s==null) return NaN;
  s=String(s).trim().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/,(?=\d{3}(\D|$))/g,'').replace(',','.');
  const m=s.match(/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i);
  return m?parseFloat(m[0]):NaN;
}
function isRight(q,a){
  if(q.type==='mc') return a!==undefined&&a!==''&&Number(a)===q.answer;
  const v=parseNum(a); if(isNaN(v)) return false;
  const tol=q.abs_tol!=null?q.abs_tol:Math.max(Math.abs(q.answer)*q.tol/100,1e-6);
  return Math.abs(v-q.answer)<=tol;
}
function testView(w){
  const key='w'+w.n, d=S.drafts[key]||{}, m=marked[key];
  const t=test(w.n);
  let head='';
  if(m){
    const pc=Math.round(m.score/w.test.length*100);
    head=`<div class="score ${pc>=PASS?'pass':'fail'}"><div class="big">${pc}%</div><div><div style="font-weight:600">${m.score} of ${w.test.length} correct · ${pc>=PASS?'Pass':'Below the '+PASS+'% pass mark'}</div><div class="hint">Best: ${t?t.best:pc}% · Attempts: ${t?t.attempts:1}</div></div><button class="btn ghost" id="retake">Retake</button></div>`;
  } else {
    head=`<div class="panel"><div class="label">${w.n===12?'Final exam · 20 questions · 90 min':'Weekly test · 10 questions · about 40 min'}</div><p style="margin-top:4px">Closed book, calculator allowed. Number answers are marked correct within 2% (angles within 1°). Type the number only: the unit is shown. Use a minus sign where a signed answer is asked for.${t?' Best so far: <b>'+t.best+'%</b>.':''}</p></div>`;
  }
  return `<div class="stack">${head}
    ${w.test.map((q,i)=>{
      const a=d[i]; const res=m?(isRight(q,m.answers[i])?'right':'wrong'):'';
      let body='';
      if(q.type==='mc'){
        body=`<div class="opts">${q.options.map((o,j)=>{let cls='';if(m){if(j===q.answer)cls='is-right';else if(String(m.answers[i])===String(j))cls='is-picked-wrong';}
          return `<label class="opt ${cls}"><input type="radio" name="q${i}" value="${j}" ${String(a)===String(j)?'checked':''} ${m?'disabled':''} data-q="${i}"><span>${o}</span></label>`}).join('')}</div>`;
      } else {
        body=`<div class="numin"><input id="${key}-q${i}" inputmode="decimal" autocomplete="off" placeholder="Your answer" value="${esc(a||'')}" ${m?'disabled':''} data-q="${i}"><span class="u">${q.unit}</span></div>`;
      }
      const fb=m?`<div class="fb">${res==='right'?'<b class="r">Correct.</b>':'<b class="w">Not quite.</b>'} ${q.type==='num'?'Answer: <b>'+q.display+' '+q.unit+'</b>. ':''}${q.explain}</div>`:'';
      return `<div class="q ${res}"><div class="qn">Q${i+1}</div><div>${q.q}</div>${body}${fb}</div>`;
    }).join('')}
    ${m?'':`<div class="row"><button class="btn" id="mark">Mark my answers</button><span class="hint" id="answered"></span></div>`}
  </div>`;
}
function countAnswered(w){const d=S.drafts['w'+w.n]||{};return w.test.filter((q,i)=>d[i]!==undefined&&String(d[i]).trim()!=='').length}

/* ---------- formulas ---------- */
function formulas(){
  return `<section class="whead"><div class="label">All weeks</div><h1>Formula sheet</h1><p class="hint" style="margin:0">Everything from the weekly formula cards in one place. Exam papers usually give you some formulas, so check which ones are provided and learn the rest.</p></section>
  <div class="stack" style="margin-top:14px">${W.filter(w=>w.formulas.length).map(w=>`<div class="panel"><div class="label" style="margin-bottom:6px">Week ${w.n} · ${esc(w.title)}</div><div class="tablewrap"><table class="formula"><tbody>${w.formulas.map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td></tr>`).join('')}</tbody></table></div></div>`).join('')}</div>`;
}

/* ---------- router & events ---------- */
function route(){const h=location.hash.replace('#','');const m=h.match(/^w(\d{1,2})$/);if(m&&+m[1]>=1&&+m[1]<=12)return{v:'week',n:+m[1]};if(h==='formulas')return{v:'formulas'};return{v:'home'}}
let lastRoute='';
function render(){
  const r=route();
  const app=$('#app');
  const sig=r.v+(r.n||'');
  if(sig!==lastRoute){ if(lastRoute) window.scrollTo(0,0); lastRoute=sig; }
  renderBar(r.n);
  if(r.v==='week') app.innerHTML=weekView(r.n);
  else if(r.v==='formulas') app.innerHTML=formulas();
  else app.innerHTML=home();
  bind(r);
}
function bind(r){
  const st=$('#start'); if(st) st.addEventListener('change',e=>{S.start=e.target.value;save();render()});
  const cp=$('#copyprog'); if(cp) cp.addEventListener('click',async()=>{
    const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const ta=$('#pasteprog');
    try{await navigator.clipboard.writeText(code);$('#progmsg').textContent='Copied. Paste it on your other device.'}
    catch(e){ta.value=code;ta.select();$('#progmsg').textContent='Select-all and copy the code in the box.'}
  });
  const lp=$('#loadprog'); if(lp) lp.addEventListener('click',()=>{
    try{const v=JSON.parse(decodeURIComponent(escape(atob($('#pasteprog').value.trim()))));
      if(typeof v!=='object'||!v.tests) throw 0;
      S=Object.assign({start:'',sessions:{},practice:{},tests:{},drafts:{}},v); save(); render(); $('#progmsg').textContent='Progress loaded.';}
    catch(e){$('#progmsg').textContent="That code didn't work. Copy the whole code and try again."}
  });
  if(r.v!=='week') return;
  const w=W[r.n-1], key='w'+r.n;
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;try{sessionStorage.setItem('s12tab',tab)}catch(e){};$('#pane').innerHTML=pane(w);document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));bindPane(w)}));
  bindPane(w);
}
function bindPane(w){
  const key='w'+w.n;
  document.querySelectorAll('[data-sess]').forEach(c=>c.addEventListener('change',()=>{const a=S.sessions[key]||[];a[+c.dataset.sess]=c.checked;S.sessions[key]=a;save();renderBar(w.n)}));
  document.querySelectorAll('[data-prac]').forEach(c=>c.addEventListener('change',()=>{const a=S.practice[key]||[];a[+c.dataset.prac]=c.checked;S.practice[key]=a;save()}));
  const ns=$('#nextstep');
  if(ns){let k=0;const e=w.example;const ol=$('#steps');
    const show=()=>{ol.insertAdjacentHTML('beforeend',`<li><span>${e.steps[k]}</span></li>`);k++;if(k>=e.steps.length){ns.disabled=true;ns.textContent='All steps shown';$('#exans').hidden=false}else ns.textContent=`Show step ${k+1} of ${e.steps.length}`};
    ns.addEventListener('click',show);
    $('#allsteps').addEventListener('click',()=>{while(k<e.steps.length)show()});}
  const upd=()=>{const el=$('#answered');if(el)el.textContent=countAnswered(w)+' of '+w.test.length+' answered'};
  document.querySelectorAll('[data-q]').forEach(inp=>{
    const ev=inp.type==='radio'?'change':'input';
    inp.addEventListener(ev,()=>{const d=S.drafts[key]||{};d[inp.dataset.q]=inp.value;S.drafts[key]=d;save();upd()});
  });
  upd();
  const mk=$('#mark');
  if(mk) mk.addEventListener('click',()=>{
    const d=S.drafts[key]||{}; const answers=w.test.map((q,i)=>d[i]);
    const score=w.test.filter((q,i)=>isRight(q,answers[i])).length;
    const pc=Math.round(score/w.test.length*100);
    marked[key]={answers,score};
    const t=S.tests[key]||{best:0,attempts:0};
    t.best=Math.max(t.best,pc); t.last=pc; t.attempts=(t.attempts||0)+1; t.date=new Date().toISOString().slice(0,10);
    S.tests[key]=t; save();
    $('#pane').innerHTML=pane(w); bindPane(w); renderBar(w.n);
    const sc=document.querySelector('.score'); if(sc) sc.scrollIntoView({block:'start'});
  });
  const rt=$('#retake');
  if(rt) rt.addEventListener('click',()=>{delete marked[key];S.drafts[key]={};save();$('#pane').innerHTML=pane(w);bindPane(w)});
}
try{const t=sessionStorage.getItem('s12tab');if(t)tab=t}catch(e){}
window.addEventListener('hashchange',()=>{tab='plan';render()});
render();
})();
</script>
<style>.drivebtn{background:none;border:1px solid var(--line);border-radius:4px;padding:4px 8px;cursor:pointer;color:var(--navy)}.drivebtn[data-state=on]{color:var(--ok);border-color:var(--ok)}.drivebtn[data-state=reconnect]{color:var(--signal);border-color:var(--signal)}#drivestatus .btn{font-size:13px}</style><script>/* Google Drive sync for the hosted site.
   Saves progress to a plain JSON file (statics-progress.json) in the user's own Drive.
   Scope drive.file: the page can only see files it created, nothing else in Drive. */
(function(){
const CLIENT_ID='704435008156-bf6a4se3fuji4rbfd5jvhmagq9dt18vm.apps.googleusercontent.com';
const FILE_NAME='statics-progress.json';
const SCOPE='https://www.googleapis.com/auth/drive.file';
const API='https://www.googleapis.com/drive/v3/files';
const UP='https://www.googleapis.com/upload/drive/v3/files';
if(!CLIENT_ID || CLIENT_ID.indexOf('__')===0) return;   // not configured yet: stay local-only

let token=null, exp=0, fileId=null, tc=null, timer=null, busy=false, again=false, wanted=false;
const ss={get:k=>{try{return JSON.parse(sessionStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const t0=ss.get('s12tok'); if(t0&&t0.exp>Date.now()+60000){token=t0.t;exp=t0.exp}
fileId=ls.get('s12file');
wanted=ls.get('s12drive')==='1';

function status(){
  if(token&&exp>Date.now()) return 'on';
  return wanted?'reconnect':'off';
}
function paint(msg){
  const b=document.getElementById('drivebtn');
  const st=status();
  if(b){b.textContent=st==='on'?'Drive ✓':st==='reconnect'?'Reconnect Drive':'Sign in';b.dataset.state=st;b.title=st==='on'?'Progress is syncing to Google Drive':'Sync progress to your Google Drive'}
  const p=document.getElementById('drivestatus');
  if(p) p.innerHTML=st==='on'
    ? `<b>Synced to Google Drive</b> as <span class="mono">${FILE_NAME}</span>. Every device you sign in on loads and saves this file. <button class="btn ghost" id="driveout" style="margin-left:6px;padding:4px 10px">Sign out</button>`
    : st==='reconnect'
    ? `Google Drive sync is set up. Tap <b>Reconnect Drive</b> at the top to pick up where you left off. Google asks again about once an hour.`
    : `<b>Sign in</b> at the top with Google to save progress to a file in your Drive and load it on any device.`;
  const o=document.getElementById('driveout'); if(o) o.onclick=signOut;
  if(msg) window.S12.setSync(msg);
}
window.S12paintDrive=paint;

function loadGis(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=res;s.onerror=()=>rej(new Error('gis'));document.head.appendChild(s)})}

async function signIn(){
  try{await loadGis()}catch(e){paint('Could not reach Google. Check your connection and try again.');return}
  if(!tc) tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:onToken,error_callback:()=>paint('Google sign-in was closed before it finished.')});
  tc.requestAccessToken({prompt:wanted?'':'consent'});
}
async function onToken(r){
  if(r.error){paint('Google sign-in failed: '+r.error);return}
  token=r.access_token; exp=Date.now()+(r.expires_in||3600)*1000;
  ss.set('s12tok',{t:token,exp}); wanted=true; ls.set('s12drive','1');
  paint('Connecting to Google Drive…');
  try{await pull(); paint('Synced to Google Drive')}catch(e){handle(e)}
}
function signOut(){
  if(token&&window.google&&google.accounts) try{google.accounts.oauth2.revoke(token,()=>{})}catch(e){}
  token=null;exp=0;wanted=false;ss.del('s12tok');ls.del('s12drive');
  paint('Signed out. Progress saves on this device. Your Drive file is untouched.');
}
function handle(e){
  if(e&&e.status===401){token=null;exp=0;ss.del('s12tok');paint('Google sign-in expired. Tap Reconnect Drive to keep syncing. Progress is safe on this device.')}
  else paint('Drive sync failed just now. Saved on this device and will retry on your next change.');
}
async function api(url,opt={}){
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+token},opt.headers||{})}));
  if(!r.ok){const e=new Error('drive '+r.status);e.status=r.status;throw e}
  return r;
}
async function findFile(){
  if(fileId){try{await api(`${API}/${fileId}?fields=id,trashed`).then(r=>r.json()).then(j=>{if(j.trashed)fileId=null});if(fileId)return fileId}catch(e){if(e.status===401)throw e;fileId=null}}
  const q=encodeURIComponent(`name='${FILE_NAME}' and trashed=false`);
  const j=await api(`${API}?q=${q}&spaces=drive&orderBy=modifiedTime desc&fields=files(id,modifiedTime)`).then(r=>r.json());
  fileId=j.files&&j.files[0]?j.files[0].id:null;
  if(fileId) ls.set('s12file',fileId);
  return fileId;
}
async function pull(){
  const id=await findFile();
  let merged=window.S12.get();
  if(id){
    const remote=await api(`${API}/${id}?alt=media`).then(r=>r.json()).catch(e=>{if(e.status)throw e;return {}});
    merged=window.S12.merge(window.S12.get(),remote&&remote.progress?remote.progress:remote);
    window.S12.set(merged);
  }
  await push(true);
}
function body(){return JSON.stringify({app:'Statics in Twelve Weeks',version:1,updated:new Date().toISOString(),progress:window.S12.get()},null,1)}
async function push(){
  if(status()!=='on') return;
  if(busy){again=true;return}
  busy=true;
  try{
    if(!fileId) await findFile();
    if(fileId){
      await api(`${UP}/${fileId}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:body()});
    } else {
      const meta={name:FILE_NAME,mimeType:'application/json',description:'Progress for the Statics in Twelve Weeks study hub'};
      const bd='s12'+Math.random().toString(36).slice(2);
      const multipart=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body()}\r\n--${bd}--`;
      const j=await api(`${UP}?uploadType=multipart&fields=id`,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:multipart}).then(r=>r.json());
      fileId=j.id; ls.set('s12file',fileId);
    }
    const t=new Date(); paint('Synced to Google Drive at '+t.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}));
  }catch(e){handle(e)}
  busy=false;
  if(again){again=false;push()}
}
window.S12onSave=()=>{if(status()!=='on')return;clearTimeout(timer);timer=setTimeout(push,1500)};

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#drivebtn');if(!b)return;e.preventDefault();
  if(status()==='on'){location.hash='home';setTimeout(()=>{const p=document.getElementById('drivestatus');if(p)p.scrollIntoView({block:'center'})},50)}else signIn()});
const obs=new MutationObserver(()=>{const p=document.getElementById('drivestatus');if(p&&!p.dataset.painted){p.dataset.painted='1';paint()}});
obs.observe(document.getElementById('app'),{childList:true});
paint();
if(status()==='on') pull().catch(handle);   // same tab, token still valid: refresh from Drive
})();
</script>
